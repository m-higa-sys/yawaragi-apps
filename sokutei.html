<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>📏 測定管理（機能訓練）</title>
<style>
/* モバイル最適化（2026-07-28 案X-7）: タップ時の青いちらつきを消し、iOSの勝手な文字拡大を止める。
   タップ対象は最低48pxを確保する（現場は手袋・老眼。小さい的は押し間違いの元）。 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; background: #f0f4f8; min-height: 100vh;
  padding: 14px 12px calc(28px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
h1 { text-align: center; color: #2c3e50; font-size: 1.4em; margin-bottom: 4px; }
.subtitle { text-align: center; color: #7f8c8d; font-size: 0.85em; margin-bottom: 14px; }
.wrap { max-width: 760px; margin: 0 auto; }
/* 日付ナビ（案X-1）: ◀▶で前後日・日付タップで直接指定・「今日」で復帰。
   ⚠️動かすのは「来館者の取得日」と「測定日の既定値」だけ。期限・予定月の判定は常に今日基準（下部コメント参照）。 */
.datenav { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.dnav { border: none; background: #fff; color: #2c3e50; font-size: 1.2em; font-weight: 800; width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; font-family: inherit; }
.dpick { flex: 1; padding: 12px; font-size: 1em; border: 1.5px solid #cfd8dc; border-radius: 12px; font-family: inherit; min-height: 48px; text-align: center; background: #fff; color: #2c3e50; }
.dtoday { border: none; background: #2c3e50; color: #fff; font-weight: 700; padding: 0 14px; height: 48px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: .92em; white-space: nowrap; }
/* 警告バナー（案X-8）: 今日以外を見ている／取得に失敗している、を画面上部で1回だけ伝える */
.dstate { display: none; align-items: center; gap: 8px; margin: 0 0 12px; padding: 11px 12px; border-radius: 10px; font-size: .88em; font-weight: 800; }
.dstate.on { display: flex; }
.dstate.past { background: #fdf1df; border: 1.5px solid #f0a83a; color: #b46f10; }
.dstate.future { background: #fdecea; border: 1.5px solid #ef9a9a; color: #c62828; }
.errbar { display: none; background: #fff3e0; border: 1px solid #ffcc80; color: #c85200; border-radius: 10px; padding: 10px 12px; font-size: .84em; font-weight: 700; margin-bottom: 10px; }
/* 午前午後2カラム（案X-3）: 広幅は並列・狭幅は縦積み。列見出しに人数を出す */
.cols { display: flex; gap: 10px; align-items: flex-start; }
.col { flex: 1; min-width: 0; }
.colhead { font-size: .86em; font-weight: 800; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; text-align: center; }
.colhead.am { background: #e3f2fd; color: #1565c0; }
.colhead.pm { background: #fff3e0; color: #e65100; }
.col-empty { text-align: center; color: #b0bec5; padding: 16px 6px; font-size: .86em; }
@media (max-width: 620px) { .cols { flex-direction: column; } }
.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tab-btn { flex: 1; padding: 13px 6px; border: none; border-radius: 10px; background: #fff; color: #546e7a; font-weight: 700; font-size: .92em; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-family: inherit; min-height: 48px; }
.tab-btn.active { background: #2c3e50; color: #fff; }
.card { background: #fff; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; border-left: 6px solid #b0bec5; box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: opacity .45s ease; }
.card.b-red { border-left-color: #ef5350; }
.card.b-yellow { border-left-color: #ffa726; }
.card.b-white { border-left-color: #b0bec5; }
.card.gray { opacity: .55; }
/* カード全体タップ（案X-6）: 名前のどこを押しても記録モーダルが開く。ボタンは stopPropagation で個別動作を守る */
.card.tappable { cursor: pointer; transition: opacity .45s ease, transform .05s ease; }
.card.tappable:active { transform: scale(.995); }
/* 保存後グレーアウト（案X-4）: 済んだ行は消さずに沈める。消えると「本当に入ったのか」が分からず二度押しの元になる */
.card.sunk { opacity: .45; cursor: default; }
.done-tag { font-size: .82em; color: #2e7d32; font-weight: 700; }
.pill { font-size: .78em; border-radius: 6px; padding: 2px 8px; white-space: nowrap; font-weight: 700; }
.pill.am { background: #e3f2fd; color: #1565c0; }
.pill.pm { background: #fff3e0; color: #e65100; }
.rowline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bdg { font-size: 1.0em; }
.nm { font-weight: 700; color: #2c3e50; font-size: 1.06em; }
.cr { font-size: .8em; color: #607d8b; background: #eceff1; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag { font-size: .8em; color: #90a4ae; border: 1px solid #cfd8dc; border-radius: 6px; padding: 1px 7px; }
.meta { font-size: .84em; color: #607d8b; line-height: 1.7; margin-top: 4px; }
.over { color: #c62828; font-weight: 700; }
.hdr { font-size: .88em; font-weight: 700; color: #455a64; margin: 4px 2px 10px; }
.section-label { font-size: .85em; font-weight: 700; color: #78909c; margin: 16px 0 6px; }
.note { font-size: .82em; color: #90a4ae; margin: 10px 2px 4px; line-height: 1.6; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
.f-btn { padding: 11px 16px; border: none; border-radius: 999px; background: #fff; color: #546e7a; font-weight: 700; font-size: .86em; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-family: inherit; min-height: 44px; }
.f-btn.active { background: #4272D8; color: #fff; }
.sbar-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
.sbar-row:last-child { border-bottom: none; }
.sbar-name { width: 5.5em; font-size: .88em; font-weight: 700; color: #2c3e50; flex-shrink: 0; }
.sbar-track { flex: 1; min-width: 60px; }
.sbar-fill { height: 12px; border-radius: 0 4px 4px 0; background: #4272D8; }
.sbar-val { width: 6.5em; text-align: right; font-size: .86em; color: #2c3e50; font-weight: 700; flex-shrink: 0; }
.sbar-last { width: 7em; text-align: right; font-size: .8em; color: #90a4ae; flex-shrink: 0; }
#status { text-align: center; color: #7f8c8d; padding: 20px; }
.reload-row { text-align: center; margin: 14px 0 4px; }
.reload-btn { border: none; border-radius: 8px; padding: 12px 22px; font-size: .88em; font-weight: 700; cursor: pointer; background: #eceff1; color: #546e7a; font-family: inherit; min-height: 44px; }
.rec-btn { margin-left: auto; border: none; border-radius: 8px; padding: 8px 12px; font-size: .82em; font-weight: 700; cursor: pointer; background: #e8f0fe; color: #4272D8; font-family: inherit; white-space: nowrap; }
.slide-btn { border: none; border-radius: 8px; padding: 8px 12px; font-size: .82em; font-weight: 700; cursor: pointer; background: #fff3e0; color: #e65100; font-family: inherit; white-space: nowrap; }
.rec-btn + .slide-btn { margin-left: 6px; }
.slide-btn:first-of-type { margin-left: auto; }
/* Undoバーはスクロール位置に関係なく必ず見える位置へ固定する（2026-07-28: 見えていなかった疑い・1-9-6） */
.undo-bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 720px;
  display: flex; align-items: center; gap: 10px; background: #2c3e50; color: #fff; border-radius: 10px; padding: 12px 14px;
  font-size: .92em; font-weight: 700; z-index: 200; box-shadow: 0 4px 16px rgba(0,0,0,.28); opacity: 1; transition: opacity 1.2s linear; }
.undo-bar.fading { opacity: .25; }   /* 消える直前に薄くする＝「もう消える」が分かる */
.undo-msg { flex: 1; }
.undo-btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: .95em; font-weight: 700; cursor: pointer; background: #ffd54f; color: #2c3e50; font-family: inherit; white-space: nowrap; }
/* 送信中の行：押した瞬間にここが効く（応答は待たない） */
.card.busy { background: #f5f7fa; box-shadow: inset 0 0 0 2px #4272D8; }
.card.busy .nm { opacity: .75; }
.card button[disabled] { opacity: .55; cursor: default; }
.rowerr { margin-top: 6px; font-size: .84em; font-weight: 700; color: #c62828; background: #fdecea; border-radius: 6px; padding: 7px 9px; }
.done-all { background: #e8f5e9; color: #2e7d32; border-radius: 12px; padding: 26px 12px; text-align: center; font-size: 1.5em; font-weight: 700; margin-bottom: 8px; }
.ym-btn { border: 1px solid #cfd8dc; border-radius: 6px; padding: 4px 9px; font-size: 1em; font-weight: 700; cursor: pointer; background: #f7fafc; color: #37474f; font-family: inherit; white-space: nowrap; }
.ym-btn:active { background: #eceff1; }
.ym-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 4px; }
.ym-cell { border: 1px solid #cfd8dc; border-radius: 8px; padding: 14px 4px; font-size: 1em; font-weight: 700; cursor: pointer; background: #fff; color: #2c3e50; font-family: inherit; min-height: 48px; }
.ym-cell.sel { background: #4272D8; color: #fff; border-color: #4272D8; }
.ym-cell.risky { border-color: #ef9a9a; background: #fdecea; color: #c62828; }
.ym-cell.risky.sel { background: #c62828; color: #fff; border-color: #c62828; }
.ym-cell:active { background: #eceff1; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal-box { background: #fff; border-radius: 14px; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-height: calc(100vh - 32px); overflow-y: auto; }
.modal-title { font-weight: 700; color: #2c3e50; font-size: 1.05em; margin-bottom: 6px; }
.modal-name { font-weight: 700; color: #4272D8; font-size: 1.12em; margin-bottom: 12px; }
.modal-label { display: block; font-size: .84em; color: #607d8b; font-weight: 700; margin: 12px 0 4px; }
.modal-select, .modal-input { width: 100%; padding: 12px 10px; border: 1.5px solid #cfd8dc; border-radius: 8px; font-size: 1em; font-family: inherit; min-height: 48px; background: #fff; color: #2c3e50; }
.modal-hint { font-size: .8em; color: #90a4ae; margin-top: 8px; line-height: 1.6; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-btn { flex: 1; border: none; border-radius: 8px; padding: 14px; font-size: .95em; font-weight: 700; cursor: pointer; font-family: inherit; min-height: 50px; }
.modal-btn.cancel { background: #eceff1; color: #546e7a; }
.modal-btn.confirm { background: #4272D8; color: #fff; }
.modal-btn.confirm:disabled { opacity: .6; cursor: default; }
/* ===== 共通フィルタバー（2026-07-28・他アプリへ展開予定の標準パターン）===== */
/* モバイルで画面を食わないよう、既定は畳んでおき「絞り込み」を押したら開く。
   絞り込み中は畳んでいても分かるよう、見出しに適用中の件数バッジを出す。 */
.ufbar { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 12px; overflow: hidden; }
.uf-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; min-height: 48px; font-weight: 700; color: #455a64; font-size: .9em; }
.uf-head .uf-caret { margin-left: auto; color: #90a4ae; font-size: .9em; }
.uf-badge { background: #4272D8; color: #fff; border-radius: 999px; padding: 2px 9px; font-size: .78em; font-weight: 700; }
.uf-body { display: none; padding: 0 14px 12px; border-top: 1px solid #eceff1; }
.ufbar.open .uf-body { display: block; }
.uf-row { margin-top: 10px; }
.uf-label { font-size: .8em; font-weight: 700; color: #90a4ae; margin-bottom: 5px; }
.uf-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.uf-chip { border: 1px solid #cfd8dc; border-radius: 999px; background: #fff; color: #546e7a; font-weight: 700; font-size: .86em; padding: 10px 15px; cursor: pointer; font-family: inherit; min-height: 44px; }
.uf-chip.on { background: #4272D8; border-color: #4272D8; color: #fff; }
.uf-search { width: 100%; padding: 12px 12px; border: 1.5px solid #cfd8dc; border-radius: 10px; font-size: 1em; font-family: inherit; min-height: 48px; background: #fff; color: #2c3e50; }
.uf-clear { border: none; border-radius: 10px; background: #eceff1; color: #546e7a; font-weight: 700; font-size: .88em; padding: 12px 18px; cursor: pointer; font-family: inherit; min-height: 44px; margin-top: 12px; }
.uf-clear:disabled { opacity: .45; cursor: default; }
.uf-none { text-align: center; color: #78909c; background: #fff; border-radius: 12px; padding: 26px 14px; font-size: .92em; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
/* ===== 「今月やる人」タブの済み行 ===== */
/* 済は消さずに下へ積む。今月何を終わらせたかが、この1画面で分かるようにするため。 */
.card.donerow { opacity: .58; }
.card.donerow .nm { text-decoration: line-through; text-decoration-thickness: 2px; color: #607d8b; }
.done-mark { font-size: .82em; color: #2e7d32; font-weight: 700; white-space: nowrap; }
/* ===== 個訓の計画書サイクル（要介護のみ）===== */
.plan-ym { font-size: .84em; color: #5c6bc0; font-weight: 700; white-space: nowrap; }
.plan-unknown { font-size: .84em; color: #ef6c00; font-weight: 700; white-space: nowrap; }
/* 測定の期限＝計画期間が始まる前の月。開始月(plan-ym)とは別物なので色を分ける */
.plan-due { font-size: .84em; color: #00796b; font-weight: 700; white-space: nowrap; }
/* 計画月に測定結果が無くなる人。対象外になっても消さず、赤で目立たせる */
.plan-gap { font-size: .8em; font-weight: 700; color: #fff; background: #c62828; border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.card.gaprow { border-left-color: #c62828; background: #fff8f8; }
/* まだ予定月を戻せば間に合う人。赤を増やさないためオレンジで出す（2026-07-29 社長決定「丙」） */
.plan-late { font-size: .8em; font-weight: 700; color: #fff; background: #ef6c00; border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.card.laterow { border-left-color: #fb8c00; background: #fffaf3; }
.overdue-line { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ffb74d; }
.gap-head { background: #fdecea; border: 1.5px solid #ef9a9a; color: #c62828; border-radius: 10px; padding: 10px 12px; font-size: .88em; font-weight: 800; margin: 4px 0 8px; line-height: 1.6; }
/* ===== 予定月を過ぎたまま止まっている人（オレンジ）===== */
/* 赤（計画書に間に合わない）とは危険度が違うので色を分ける。赤を増やすと赤が効かなくなる。 */
.overdue-head { background: #fff4e5; border: 1.5px solid #ffb74d; color: #e65100; border-radius: 10px; padding: 10px 12px; font-size: .88em; font-weight: 800; margin: 4px 0 8px; line-height: 1.6; }
/* ===== 出力2チェック（🖨 利用者用 / 📄 ケアマネ用）===== */
/* 測定が済んでも、この2つが済むまでその人は完了ではない。未は必ず目立つ側の色で出す。 */
.out-btn { border: 1.5px solid #cfd8dc; border-radius: 8px; padding: 8px 10px; font-size: .82em; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; background: #fff; color: #546e7a; }
.out-btn + .out-btn { margin-left: 6px; }
.out-btn:first-of-type { margin-left: auto; }
.out-btn.on { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }
.out-btn.off { background: #fff3e0; border-color: #fb8c00; color: #e65100; font-weight: 800; }
.out-btn:disabled { opacity: .5; cursor: default; }
/* 済んだ行はグレーになるが、出力が残っているボタンとバッジだけは沈ませない（3-4） */
.card.donerow .out-btn.off, .card.donerow .out-pending { opacity: 1; filter: none; }
.card.pendingrow { opacity: 1; border-left-color: #fb8c00; background: #fffaf3; }
.card.pendingrow .nm { text-decoration: none; color: #37474f; }
.out-pending { font-size: .8em; font-weight: 800; color: #fff; background: #ef6c00; border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.out-legacy { font-size: .78em; color: #78909c; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<h1>📏 測定管理</h1>
<div class="subtitle">機能訓練 測定の優先度と実施バランス（要介護・要支援等）</div>
<div class="wrap">
  <div class="datenav">
    <button type="button" class="dnav" id="prevDay" aria-label="前の日">◀</button>
    <input type="date" id="datePick" class="dpick" aria-label="日付を選ぶ">
    <button type="button" class="dnav" id="nextDay" aria-label="次の日">▶</button>
    <button type="button" class="dtoday" id="todayBtn">今日</button>
  </div>
  <div id="dstate" class="dstate"></div>
  <div id="errbar" class="errbar"></div>
  <!-- タブは画面に出る順に並べる。id の数字は既存の tab1/tab2/tab3 を動かさないため
       「今月やる人」だけ tab4 になっている（表示位置は2番目）。id を振り直すと
       既存テストの参照を大量に書き換えることになり、本当の回帰を見落としやすくなるため据え置いた。 -->
  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabbtn1" onclick="showTab(1)">📋 今日の優先</button>
    <button type="button" class="tab-btn" id="tabbtn4" onclick="showTab(4)">🗓️ 今月やる人</button>
    <button type="button" class="tab-btn" id="tabbtn2" onclick="showTab(2)">👥 全利用者</button>
    <button type="button" class="tab-btn" id="tabbtn3" onclick="showTab(3)">📊 スタッフ%</button>
  </div>
  <div id="ufbar" class="ufbar" style="display:none"></div>
  <div id="undoBar" class="undo-bar" style="display:none"></div>
  <div id="status">読み込み中…</div>
  <div id="tab1"></div>
  <div id="tab4" style="display:none"></div>
  <div id="tab2" style="display:none"></div>
  <div id="tab3" style="display:none"></div>
  <div class="reload-row"><button type="button" class="reload-btn" onclick="load()">↻ 再読込</button></div>
</div>
<div id="recordModal" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeRecordModal()">
  <div class="modal-box">
    <div class="modal-title">📝 測定を記録する</div>
    <div class="modal-name" id="recordModalName"></div>
    <label class="modal-label">測定日</label>
    <input type="date" id="recordDate" class="modal-input">
    <label class="modal-label">測定者</label>
    <select id="recordStaffSelect" class="modal-select"></select>
    <div id="recordOutputWrap">
      <label class="modal-label">出力者（要介護のみ・空欄なら測定者と同じ）</label>
      <select id="recordOutputSelect" class="modal-select"></select>
    </div>
    <label class="modal-label">メモ（任意）</label>
    <input type="text" id="recordNote" class="modal-input" placeholder="備考があれば">
    <div class="modal-hint" id="recordHint"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn cancel" onclick="closeRecordModal()">キャンセル</button>
      <button type="button" class="modal-btn confirm" id="recordConfirmBtn" onclick="submitRecord()">記録する</button>
    </div>
  </div>
</div>
<div id="ymPicker" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeYmPicker()">
  <div class="modal-box">
    <div class="modal-title">📅 次回の測定予定月</div>
    <div class="modal-name" id="ymPickerName"></div>
    <div class="ym-grid" id="ymPickerGrid"></div>
    <div class="gap-head" id="ymPickerNote" style="display:none"></div>
    <div class="note">※変わるのは予定月だけです。測定周期（要介護3ヶ月／要支援等4ヶ月）は変わりません。</div>
    <div class="modal-actions">
      <button type="button" class="modal-btn cancel" onclick="closeYmPicker()">キャンセル</button>
    </div>
  </div>
</div>
<!-- 期限計算 sokuteiCycleMonths_/sokuteiDueDate_ は shared.js §I に単一化（①測定アプリと共用）。

<script src="shared.js"></script>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbwo1UGxsK1qgmO8IDaqT-inDM0Qgoe_MRvxfKDxHy_gXANi4FwNFlgn2pEanMXVQxsdlw/exec';
// 測定者候補の除外（個訓アプリ MEASURER_EXCLUDE と同値・2026-06-15社長確定）
const MEASURER_EXCLUDE = ['代表', '小野', '林'];
const BADGE_EMOJI = { red: '🔴', yellow: '🟡', white: '⚪' };
const YOUBI_ARR = ['日', '月', '火', '水', '木', '金', '土'];

// ===== 優先度純関数（正本 = my-project/scripts/test-sokutei-priority.js から同一コード転記・1文字も変えない） =====

// sokuteiCycleMonths_(care) / sokuteiDueDate_(baseDate, care) は shared.js §I へ単一化（①測定アプリと共用）。
// 上部で <script src="shared.js"> を先に読み込むためグローバルに存在する。挙動は移設前と同一
// （scripts/test-sokutei-duedate.js が golden 88組合せで結線前後の不変を実測）。

function sokuteiRemaining_(dueDateStr, todayStr) {
  var due = Date.parse(String(dueDateStr) + 'T00:00:00Z');
  var today = Date.parse(String(todayStr) + 'T00:00:00Z');
  return Math.round((due - today) / 86400000);
}

function sokuteiTier_(care, remaining) {
  var kaigo = String(care || '').indexOf('要介護') === 0;
  if (kaigo && remaining < 0) return 0;
  if (kaigo && remaining <= 30) return 1;
  if (!kaigo && remaining < 0) return 2;
  return 3;
}

function sokuteiBadge_(care, remaining) {
  var kaigo = String(care || '').indexOf('要介護') === 0;
  if ((kaigo && remaining < 0) || (remaining >= 0 && remaining <= 7)) return 'red';
  if (remaining <= 30 || (!kaigo && remaining < 0)) return 'yellow';
  return 'white';
}

function sokuteiUsageRate_(months) {
  var s = 0, a = 0;
  for (var i = 0; i < (months || []).length; i++) {
    var sch = Number(months[i].scheduled) || 0;
    if (sch > 0) { s += sch; a += Number(months[i].attended) || 0; }
  }
  return s > 0 ? a / s : 1;
}

function sokuteiRemainingVisits_(daysStr, todayStr) {
  var s = String(daysStr || '');
  var y = parseInt(String(todayStr).slice(0, 4), 10);
  var m = parseInt(String(todayStr).slice(5, 7), 10);
  var d = parseInt(String(todayStr).slice(8, 10), 10);
  var lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  var youbi = ['日', '月', '火', '水', '木', '金', '土'];
  var count = 0;
  for (var day = d + 1; day <= lastDay; day++) {
    var w = new Date(Date.UTC(y, m - 1, day)).getUTCDay();
    if (s.indexOf(youbi[w]) !== -1) count++;
  }
  return count;
}

function sokuteiSort_(rows) {
  var out = [];
  for (var i = 0; i < (rows || []).length; i++) {
    var r = rows[i];
    var c = {};
    for (var k in r) c[k] = r[k];
    c.tier = sokuteiTier_(r.care, r.remaining);
    c.badge = sokuteiBadge_(r.care, r.remaining);
    c.E = Number(r.R) * Number(r.U);
    out.push(c);
  }
  out.sort(function (a, b) {
    if (a.tier !== b.tier) return a.tier - b.tier;
    if (a.E !== b.E) return a.E - b.E;
    var ka = String(a.kana || a.name || ''), kb = String(b.kana || b.name || '');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  return out;
}

// ===== ユーティリティ =====
function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtYMD(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return fmtYMD(new Date()); }
// 'YYYY-MM-DD' へ正規化（'2026/6/5'・ISO日時・月だけの 'YYYY-MM'（planStart実測形式・日=01扱い）にも耐える）。解釈不能は ''
function normDate(s) {
  if (s == null) return '';
  const m = String(s).match(/^(\d{4})[\/\-](\d{1,2})(?:[\/\-](\d{1,2}))?/);
  return m ? m[1] + '-' + pad2(+m[2]) + '-' + pad2(m[3] ? +m[3] : 1) : '';
}
// 表示用 'M/D'（年が違えば 'YYYY/M/D'）
function fmtMD(ymd) {
  if (!ymd) return '—';
  const y = +ymd.slice(0, 4), m = +ymd.slice(5, 7), d = +ymd.slice(8, 10);
  return (y === new Date().getFullYear() ? '' : y + '/') + m + '/' + d;
}
function fiscalYear() { const n = new Date(); return (n.getMonth() + 1) >= 4 ? n.getFullYear() : n.getFullYear() - 1; }
// 前月から遡って n ヶ月分の 'YYYY-MM'（昇順・当月は含めない＝月途中の scheduled 歪み回避）
function prevMonthsList(n) {
  const now = new Date(); const list = [];
  for (let i = n; i >= 1; i--) {
    const t = new Date(now.getFullYear(), now.getMonth() - i, 1);
    list.push(t.getFullYear() + '-' + pad2(t.getMonth() + 1));
  }
  return list;
}
// 今日から n ヶ月前の 'YYYY-MM-DD'（月末丸め）
function monthsAgoStr(n) {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() - n, 1);
  const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return first.getFullYear() + '-' + pad2(first.getMonth() + 1) + '-' + pad2(Math.min(now.getDate(), lastDay));
}
// 利用曜日から今日以降の直近該当日 '7/4(金)'（4週先まで探して無ければ '—'）
function nextVisitStr(daysStr, tStr) {
  const s = String(daysStr || '');
  if (!s) return '—';
  const y = +tStr.slice(0, 4), m = +tStr.slice(5, 7), d = +tStr.slice(8, 10);
  for (let i = 0; i < 28; i++) {
    const t = new Date(Date.UTC(y, m - 1, d + i));
    const w = t.getUTCDay();
    if (s.indexOf(YOUBI_ARR[w]) !== -1) return (t.getUTCMonth() + 1) + '/' + t.getUTCDate() + '(' + YOUBI_ARR[w] + ')';
  }
  return '—';
}

// ===== 状態 =====
// selectedDate（案X-1/2）＝日付ナビで選んでいる日。動かす対象は次の2つ「だけ」。
//   ① 来館者（attendance）をどの日で取るか   ② 記録モーダルの「測定日」の既定値
// 期限（remaining）と予定月の当月判定（isDue）は **常に today 基準**のまま動かさない。
//   理由: 予定月は月単位の運用。選択日基準にすると来月の日付を1タップ選んだだけで
//   「今月の対象」の人数が丸ごと入れ替わり、現場が何を見ているのか分からなくなる。
//   過去日の測定を入れたいだけなのに対象一覧が変わるのは事故の元（2026-07-28 移植時の判断）。
// sunk（案X-4）= この画面で保存/変更を済ませた行。消さずに沈めて「入った」を残す。再読込でリセット。
const state = { today: todayStr(), selectedDate: todayStr(), att: null, usage: null, users: [], records: [], staff: [], shien: [], userList: [], tsushoUsers: [], yotei: [], output: { rows: [], legacy: [] }, errs: {}, sunk: {} };
function isKaigoCare(care) { return String(care || '').indexOf('要介護') === 0; }
// 当月キー。新しい日付関数は作らず、既存の todayStr()（state.today）の先頭7桁を使う。
function thisYm() { return state.today.slice(0, 7); }
// 氏名の突合キー（GAS側 _normalizeUserName と同方針・NFKC＋空白除去＋末尾敬称除去）
function normKey(s) {
  return String(s == null ? '' : s).normalize('NFKC').replace(/[\s　]/g, '').replace(/(様|さま|サマ)$/, '');
}
let derived = { rowByName: {} };
let careFilter = 'all';   // 介護度フィルタ（共通フィルタバーの一部・全タブ共通）
let periodMonths = 1;     // タブ3 期間（1/2/3ヶ月）
let currentTab = 1;
// 共通フィルタの状態。タブを切り替えても保持する（同じ人を別の切り口で見たいため・B-7）
let uf = { days: [], slots: [], query: '' };
let ufOpen = false;       // フィルタバーを開いているか（モバイルで画面を食わないよう既定は畳む）

// =====================================================================
// 共通フィルタの純関数（2026-07-28・★他アプリへ展開予定の標準パターン★）
// -----------------------------------------------------------------
// DOM にも GAS にも state にも依存しない。曜日・午前午後・名前検索は口腔／個訓／通所でも
// 同じものが要るため、後日そのまま shared.js へ移して共有する。ここでは sokutei.html 内に
// 置いているが、移設しやすいよう「この1ブロックで完結」させてある（外の変数を読まない）。
// 移設時は shared.js が 🔢版 を握るので、版上げのタイミングと合わせること。
//
// 入力の1件が持つ想定のキー（余分なキーは無視する）:
//   { name, kana, weekdays, ampm }
//     weekdays … 利用曜日の文字列。'火木' のように曜日文字が並ぶ（利用者台帳「利用曜日」列）
//     ampm     … 午前/午後の文字列。'午前' / '午後' / '月午前、木午後' の3形（同台帳「午前/午後」列）
// =====================================================================

// 検索用キー。NFKC（全角半角の統一）＋空白除去＋敬称除去に加えて、
// カタカナ→ひらがな へ寄せる。これで「田中」「たなか」「タナカ」「ﾀﾅｶ」が同じキーになる。
// 生の === や includes で比べない（表記ゆれで引けなくなるため）。
function ufSearchKey(s) {
  let t = String(s == null ? '' : s);
  if (typeof t.normalize === 'function') t = t.normalize('NFKC');   // 半角カナ→全角カナもここで揃う
  t = t.replace(/[\s　]/g, '').replace(/(様|さま|サマ)$/, '');
  // カタカナ→ひらがな（長音符・小書き文字もそのまま対応する範囲）
  t = t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  return t.toLowerCase();
}

// 午前/午後列の解釈。返り: [{ day:'月'|''（曜日指定なし）, slot:'am'|'pm' }, ...]
//   '午前'          → [{ day:'', slot:'am' }]
//   '月午前、木午後' → [{ day:'月', slot:'am' }, { day:'木', slot:'pm' }]
// 曜日別に枠が違う人が実在する（2026-07-28 実測: 112名中2名）。単純な文字列包含だと
// 「月曜は午前の人」が「月曜×午後」の絞り込みにも出てしまうため、対で持つ。
function ufParseAmpm(raw) {
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return [];
  const out = [];
  s.split(/[、,・\/／\s]+/).forEach(part => {
    if (!part) return;
    const m = part.match(/([月火水木金土日]?)\s*(午前|午後|AM|PM|am|pm)/);
    if (!m) return;
    const slot = /午前|AM|am/.test(m[2]) ? 'am' : 'pm';
    out.push({ day: m[1] || '', slot: slot });
  });
  return out;
}

// 曜日の一致。days が空＝絞り込みなし＝全通し。
function ufMatchDays(weekdays, days) {
  if (!days || !days.length) return true;
  const w = String(weekdays == null ? '' : weekdays);
  return days.some(d => w.indexOf(d) !== -1);
}

// 午前午後の一致。slots が空＝絞り込みなし。
// 曜日も同時に絞っているときは、その曜日ぶんの枠だけを見る（曜日指定なしの枠は常に対象）。
function ufMatchSlots(row, slots, days) {
  if (!slots || !slots.length) return true;
  const parsed = ufParseAmpm(row && row.ampm);
  if (!parsed.length) return false;   // 枠が分からない人は、枠で絞っているとき出さない
  const dayFilterOn = !!(days && days.length);
  return parsed.some(p => {
    if (slots.indexOf(p.slot) === -1) return false;
    if (!dayFilterOn || !p.day) return true;   // 曜日指定のない枠は常に有効
    return days.indexOf(p.day) !== -1;
  });
}

// 名前の部分一致（漢字・ひらがな・カタカナ・全角半角のゆれに強い）。氏名とふりがなの両方を見る。
function ufMatchQuery(row, query) {
  const q = ufSearchKey(query);
  if (!q) return true;
  return ufSearchKey(row && row.name).indexOf(q) !== -1
    || ufSearchKey(row && row.kana).indexOf(q) !== -1;
}

// 曜日ボタンに出す曜日を、実データ（利用者の利用曜日）から決める。
// 固定リストにしないのは、土曜営業を始めたときにコードを触らずに土ボタンが出るようにするため
//   （2026-07-28 社長決定。開始時の手直しを無くす）。1人でも土曜利用者が登録されれば出る。
// 並び順は必ず 月→日 の曜日順に固定する（データの出現順にすると画面のボタンが日替わりで動く）。
// 利用曜日が空の人は何も足さない（空文字が曜日として混ざらない）。
const UF_DAY_ORDER = ['月', '火', '水', '木', '金', '土', '日'];
function ufAvailableDays(list) {
  const seen = {};
  (list || []).forEach(r => {
    const w = String((r && r.weekdays) || '');
    if (!w) return;
    UF_DAY_ORDER.forEach(d => { if (w.indexOf(d) !== -1) seen[d] = true; });
  });
  return UF_DAY_ORDER.filter(d => seen[d]);
}

// =====================================================================
// 個訓の計画書サイクルとの整合（2026-07-29）
// -----------------------------------------------------------------
// 要介護は「測定 → その結果で個別機能訓練計画書を作る」順で、計画書の月は planStart 起点で
// 動かせない。予定月だけ後ろへスライドすると「計画書を作る月に測定結果が無い」が起きる。
// 要支援・事業対象者は計画書が無いのでこの問題は起きない（測定＝報告のトリガーで、報告も一緒に動く）。
//
// 判定は shared.js §I のものを「使う」。同じ判定をここに複製しない。
// 月の足し算は yotei-core.js の ymAdd を使う（新しい日付関数を作らない）。
//
// ★2026-07-29 訂正: 測定の期限は「計画月」ではなく「計画期間が始まる前の月」だった。
//   社長が本番で発見。実例: 計画期間 2026-07-01〜09-30 ／ 身体機能評価 6/10 ／ 計画書 6/24。
//   次の期間は 10/1〜 なので次の測定は 9月 が正しいのに、アプリは「9月にすると計画書の月に
//   測定結果が無い」と誤報していた。原因は期限に isPlanMonth（＝計画期間の開始月）を使っていたこと。
//   実測（個訓シート153行）: keikaku_date 70件中59件・sokutei_date 20件中18件・tasseido_date 34件中33件が
//   「開始月＋2ヶ月（＝次期間の前月）」に集中。測定は月初、計画書は月末に寄っている。
//   → 期限の判定は shared.js の isHyoukaMonth（評価月）に寄せる。個訓アプリが元から使っている関数で、
//     shared.js は1バイトも変えていない。2つのアプリが同じ関数・同じ引数で同じ月を返す状態にする。
// =====================================================================

// 当月以降で最初に judgeFn が true を返す月 'YYYY-MM'。算出できなければ ''。
// judgeFn は差し替え可能（テストからの注入と、期限／開始月の使い分けのため）。
// 既定は shared.js の isHyoukaMonth（＝測定の期限）。開始月が欲しいときは isPlanMonth を渡す。
function nextPlanYm(planStart, planMonths, fromYm, judgeFn, maxMonths) {
  const f = judgeFn || (typeof isHyoukaMonth === 'function' ? isHyoukaMonth : null);
  if (!f || !planStart || !/^\d{4}-\d{2}/.test(String(fromYm || ''))) return '';
  const n = maxMonths || 24;
  for (let i = 0; i < n; i++) {
    const ym = ymAdd(fromYm, i);
    if (!ym) return '';
    if (f(planStart, planMonths, +ym.slice(0, 4), +ym.slice(5, 7))) return ym;
  }
  return '';
}

// 測定の期限（＝個訓の評価月＝計画期間の最終月＝次期間の前月）。判定に使うのは常にこちら。
function nextDueYm(planStart, planMonths, fromYm) {
  return nextPlanYm(planStart, planMonths, fromYm,
    (typeof isHyoukaMonth === 'function' ? isHyoukaMonth : null), 24);
}
// 計画期間の開始月。★画面に「計画書 ◯月」と出す表示用。判定には使わない。
// 期限の月をそのまま「計画書 ◯月」と出すと、今度は表示のほうが嘘になるため分けている。
function nextPlanStartYm(planStart, planMonths, fromYm) {
  return nextPlanYm(planStart, planMonths, fromYm,
    (typeof isPlanMonth === 'function' ? isPlanMonth : null), 24);
}

// 'YYYY-MM' の差（a - b ヶ月）。解釈不能は null。
function ymMonthsBetween(a, b) {
  if (!/^\d{4}-\d{2}/.test(String(a || '')) || !/^\d{4}-\d{2}/.test(String(b || ''))) return null;
  return (+a.slice(0, 4) - +b.slice(0, 4)) * 12 + (+a.slice(5, 7) - +b.slice(5, 7));
}

// 「その予定月にすると、計画書を作る時点で使える測定結果が無くなるか」を判定する純関数。
//   opt = { isKaigo, dueYm, lastYm, cycleMonths, chosenYm }
//   ★dueYm = 測定の期限（＝評価月＝計画期間が始まる前の月）。計画期間の開始月ではない。
//     旧キー planYm でも受ける（既存の呼び出しを壊さないため）。
// 返り: { warn, kind }
//   'notKaigo'    要支援・事業対象者＝計画書が無い。何ヶ月でも動かせる
//   'unknownPlan' 期限が算出できない。警告の対象外だが、画面には「計画書 月不明」と出す
//   'inTime'      期限までに測る＝問題なし
//   'covered'     期限を越えるが、直近の測定がその期限まで有効＝実害なし
//                 （例: 6月に測って期限が9月・周期3。9月の計画書は6月の測定結果で書ける）
//   'gap'         ★期限に使える測定結果が無い。ここだけ警告する
// ⚠️「越えたら即警告」にはしない。確認文が「測定結果がありません」と断言するため、
//   直近の測定でカバーできている人に出すと嘘の警告になり、やがて誰も読まなくなる。
//   2026-07-29 実測: 単純比較だと19名が該当するが、18名は今月測ったばかりで実害なし。
function planGapCheck(opt) {
  const o = opt || {};
  if (!o.isKaigo) return { warn: false, kind: 'notKaigo' };
  const dueYm = String(o.dueYm || o.planYm || '');
  if (!dueYm) return { warn: false, kind: 'unknownPlan' };
  const d = ymMonthsBetween(String(o.chosenYm || ''), dueYm);
  if (d === null || d <= 0) return { warn: false, kind: 'inTime' };
  const lastYm = String(o.lastYm || '');
  if (lastYm) {
    const cyc = parseInt(o.cycleMonths, 10) || 3;
    const age = ymMonthsBetween(dueYm, lastYm);   // 期限の時点で前回測定が何ヶ月前か
    // 測定は周期ぶん有効とみなす。周期3なら「期限の2ヶ月前まで」の測定は使える
    if (age !== null && age >= 0 && age <= cyc - 1) return { warn: false, kind: 'covered' };
  }
  return { warn: true, kind: 'gap' };
}

// 行モデルから planGapCheck を呼ぶ薄い橋渡し（呼び出し側で同じ組み立てを繰り返さない）
// ★渡すのは dueYm（期限）。planYm（計画期間の開始月）は表示専用で、判定には使わない。
function rowPlanGap(r, chosenYm) {
  return planGapCheck({
    isKaigo: isKaigoCare(r && r.care),
    dueYm: (r && r.dueYm) || '',
    lastYm: (r && r.last) ? String(r.last).slice(0, 7) : '',
    cycleMonths: (r && r.cycleMonths) || 0,
    chosenYm: chosenYm
  });
}

// =====================================================================
// 出力2チェック（🖨 利用者用プリント／📄 ケアマネ用PDF）2026-07-29
// ---------------------------------------------------------------------
// 実態（社長）: 結果報告書はリハブで作る。測定値を入れた時点で報告書はできあがるため
//   「作成」という作業は無い。残るのは印刷とPDF出力の2つだけ。両方済んで初めて完了。
//   片方でも残っていたら「やり残し」＝一覧から消さない（消えると忘れる）。
// 正は「測定出力」シート（1測定回＝1行）。行が無い人だけ、個訓15列目の既存実績（legacy）を見る。
//   legacy は旧アプリの出力者1列で、当時は出力という概念が1つだったので🖨📄の両方が済とみなす。
//   ★行があればそちらが常に優先。行の作成時に GAS 側が legacy を引き継ぐので、
//     1つ押した瞬間にもう片方が「未」へ落ちることはない（writeSokuteiOutput_ / seedFromLegacy）。
// =====================================================================
const OUTPUT_KINDS = ['riyousha', 'caremgr'];
const OUTPUT_LABEL = { riyousha: '🖨 利用者用', caremgr: '📄 ケアマネ用' };

// output = { rows:[「測定出力」シートの行], legacy:[個訓15列目の既存実績] }
// 返り: { riyousha:{done,by,at}, caremgr:{done,by,at}, source:'sheet'|'legacy'|'none', ym }
function outputStatusFrom(output, userId, name, ym) {
  const blank = () => ({ done: false, by: '', at: '' });
  const none = { riyousha: blank(), caremgr: blank(), source: 'none', ym: ym || '' };
  if (!/^\d{4}-\d{2}$/.test(String(ym || ''))) return none;
  const hit = (x) => (userId && x.userId === userId) || (name && x.name === name);
  const rows = (output && output.rows) || [];
  for (let i = 0; i < rows.length; i++) {
    const x = rows[i];
    if (x.ym !== ym || !hit(x)) continue;
    return {
      riyousha: { done: !!x.riyousha_at, by: x.riyousha_by || '', at: x.riyousha_at || '' },
      caremgr: { done: !!x.caremgr_at, by: x.caremgr_by || '', at: x.caremgr_at || '' },
      source: 'sheet', ym: ym
    };
  }
  const leg = (output && output.legacy) || [];
  for (let i = 0; i < leg.length; i++) {
    const x = leg[i];
    if (x.ym !== ym || !hit(x)) continue;
    return {
      riyousha: { done: true, by: x.by || '', at: x.sokutei_date || '' },
      caremgr: { done: true, by: x.by || '', at: x.sokutei_date || '' },
      source: 'legacy', ym: ym
    };
  }
  return none;
}

// 行モデルから outputStatusFrom を呼ぶ薄い橋渡し（呼び出し側で同じ組み立てを繰り返さない）。
// 測定年月は「当月に測定した日」の年月。まだ測っていない人には出力の概念そのものが無い。
function rowOutputStatus(r, output) {
  const src = output || (typeof state !== 'undefined' ? state.output : null);
  const ym = (r && r.doneThisMonth && r.doneThisMonth.date) ? String(r.doneThisMonth.date).slice(0, 7) : '';
  return outputStatusFrom(src, r && r.userId, r && r.name, ym);
}

// 3段階（3-3）: 'unmeasured'（測定未）/ 'pending'（測定済・出力残あり）/ 'complete'（完了）
function outputStage(r, output) {
  if (!(r && r.doneThisMonth)) return 'unmeasured';
  const st = rowOutputStatus(r, output);
  return (st.riyousha.done && st.caremgr.done) ? 'complete' : 'pending';
}

// ヘッダ件数（3-5）。{ total, complete, pending, unmeasured }
function countOutputStages(rows, output) {
  const out = { total: 0, complete: 0, pending: 0, unmeasured: 0 };
  (rows || []).forEach(r => { out.total++; out[outputStage(r, output)]++; });
  return out;
}

// 予定月を過ぎたまま止まっている人（オレンジ・4-2）。判定は「予定月 < 当月」。当月ちょうどは対象外。
function isOverdueYm(nextYm, ym) {
  const a = String(nextYm || ''), b = String(ym || '');
  if (!/^\d{4}-\d{2}$/.test(a) || !/^\d{4}-\d{2}$/.test(b)) return false;
  return a < b;
}
// 「4月 1名 ／ 6月 2名」の内訳文字列（4-1）
function overdueBreakdown(rows) {
  const by = {};
  (rows || []).forEach(r => { const k = String(r.nextYm || ''); if (k) by[k] = (by[k] || 0) + 1; });
  return Object.keys(by).sort().map(k => (+k.slice(5, 7)) + '月 ' + by[k] + '名').join(' ／ ');
}

// 警告の見せ方を2段階に分ける（2026-07-29 社長決定「丙」＝赤を増やさない）。
//   'red'  … 予定月が測定期限を「周期ぶん以上」越えている＝1回分まるごと飛ばしている。
//            入院・長期欠席などで本当に測れない人がここに来る。赤はこれだけに残す
//   'late' … 越えているが1周期未満＝予定月を戻せばまだ間に合う。オレンジで出す
//   ''     … 警告なし
// 「越えたら即赤」にしないのは、赤を増やすと赤が効かなくなるため（2026-07-29 社長決定「丙」）。
// ym は当月（将来この判定を当月基準へ広げるときのために受けるが、いまは使わない）。
function planGapLevel(r, chosenYm, ym) {
  if (!rowPlanGap(r, chosenYm).warn) return '';
  const over = ymMonthsBetween(String(chosenYm || ''), (r && r.dueYm) || '');
  const cyc = parseInt(r && r.cycleMonths, 10) || 3;
  return (over !== null && over >= cyc) ? 'red' : 'late';
}

// 「今月やる人」タブの行分け。★二重表示の防止をここ1箇所に閉じ込める（4-4）。
//   gapRows     … 赤の枠（期限を過ぎてしまった人）だけ
//   lateRows    … オレンジの2行目（計画に間に合わない・まだ戻せる）。一覧にはそのまま並べる
//   rest        … 赤に出た人を除いた残り。オレンジも未／出力残／完了もすべてここから作る
//   overdueRows … rest のうち予定月が当月より前（オレンジの1行目）。赤に出た人は構造的にここへ来ない
function splitMonthRows(rows, ym) {
  const lv = r => planGapLevel(r, r.nextYm, ym);
  const gapRows = (rows || []).filter(r => lv(r) === 'red');
  const gapNames = {}; gapRows.forEach(r => { gapNames[r.name] = true; });
  const rest = (rows || []).filter(r => !gapNames[r.name]);
  return {
    gapRows: gapRows,
    lateRows: rest.filter(r => lv(r) === 'late'),
    rest: rest,
    overdueRows: rest.filter(r => isOverdueYm(r.nextYm, ym))
  };
}
// 「9月 2名 ／ 10月 1名」の内訳文字列（期限の月ごと）
function lateBreakdown(rows) {
  const by = {};
  (rows || []).forEach(r => { const k = String((r && r.dueYm) || ''); if (k) by[k] = (by[k] || 0) + 1; });
  return Object.keys(by).sort().map(k => (+k.slice(5, 7)) + '月 ' + by[k] + '名').join(' ／ ');
}

// 3条件の AND。opt = { days:[], slots:[], query:'' }。opt 省略・空は素通し。
function filterUsers(list, opt) {
  const o = opt || {};
  const days = o.days || [], slots = o.slots || [], query = o.query || '';
  if (!days.length && !slots.length && !String(query).trim()) return (list || []).slice();
  return (list || []).filter(r =>
    ufMatchDays(r && r.weekdays, days) && ufMatchSlots(r, slots, days) && ufMatchQuery(r, query));
}

// 何かしら絞り込んでいるか（見出しのバッジ・クリアボタンの活性に使う）
function ufActiveCount(f, care) {
  return (f.days || []).length + (f.slots || []).length
    + (String(f.query || '').trim() ? 1 : 0) + ((care && care !== 'all') ? 1 : 0);
}

// ===== 取得（Promise.allSettled・1つ失敗しても他タブは描画 = teirei の safe 精神） =====
async function fetchJson(url) {
  const res = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
function errMsg(r) {
  if (r.status === 'rejected') return (r.reason && r.reason.message) || String(r.reason);
  return (r.value && (r.value.error || r.value.message)) || '応答形式エラー';
}

// dateStr 省略 = 今日。日付ナビ（◀▶／日付タップ／今日）からは必ずここを通す。
async function load(dateStr) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '読み込み中…';
  state.errs = {};
  state.sunk = {};                 // 日付を変えたら「済」マークは見直す（その日視点で見る）
  const t = state.today = todayStr();
  const sel = state.selectedDate = (dateStr && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) ? dateStr : t;
  updateDateNav();
  const fy = fiscalYear();
  const months = prevMonthsList(3);
  const results = await Promise.allSettled([
    fetchJson(GAS + '?action=attendance&date=' + sel + '&t=' + Date.now()),   // 来館者だけが選択日で動く
    fetchJson(GAS + '?action=usage_stats&from=' + months[0] + '&to=' + months[months.length - 1] + '&t=' + Date.now()),
    fetchJson(GAS + '?action=getKeikakushoYear&year=' + fy + '&t=' + Date.now()),
    fetchJson(GAS + '?action=getKeikakushoYear&year=' + (fy + 1) + '&t=' + Date.now()),
    fetchJson(GAS + '?action=getKeikakushoYear&year=' + (fy - 1) + '&t=' + Date.now()),
    fetchJson(GAS + '?action=staff_list&t=' + Date.now()),
    fetchJson(GAS + '?action=getShienSokutei&t=' + Date.now()),
    fetchJson(GAS + '?action=user_list&t=' + Date.now()),
    fetchJson(GAS + '?action=getTsushoPlansYearV2&year=' + fy + '&t=' + Date.now()),
    fetchJson(GAS + '?action=getYotei&domain=sokutei&t=' + Date.now()),
    // 出力2チェック（🖨利用者用／📄ケアマネ用）。当月ぶんだけ取る＝1測定回＝1行の設計なので月で足りる
    fetchJson(GAS + '?action=getSokuteiOutput&domain=sokutei&ym=' + thisYm() + '&t=' + Date.now())
  ]);
  // year は暦年のため、4月以降に前暦年の測定レコードが漏れないよう fy−1 も含めた3年分をマージ（GAS側 year 厳密一致・重複二重計上なし）
  const att = results[0], usage = results[1], years = [results[2], results[3], results[4]], staff = results[5];
  const shien = results[6], userList = results[7], tsushoUsers = results[8], yotei = results[9], output = results[10];
  if (att.status === 'fulfilled' && att.value && att.value.success && att.value.attendance) state.att = att.value;
  else { state.att = null; state.errs.att = errMsg(att); }
  if (usage.status === 'fulfilled' && usage.value && usage.value.success && usage.value.usageStats) state.usage = usage.value.usageStats;
  else { state.usage = null; state.errs.usage = errMsg(usage); }
  const okYears = years.filter(r => r.status === 'fulfilled' && r.value && r.value.ok);
  state.users = [];
  for (let i = 0; i < okYears.length; i++) {   // users は fy → fy+1 → fy−1 の優先順で最初に取れた年のもの
    if ((okYears[i].value.users || []).length) { state.users = okYears[i].value.users; break; }
  }
  state.records = [];
  okYears.forEach(r => { state.records = state.records.concat(r.value.records || []); });
  if (!okYears.length) state.errs.year = errMsg(years[0]);
  if (staff.status === 'fulfilled' && staff.value && Array.isArray(staff.value.staff)) state.staff = staff.value.staff;
  else { state.staff = []; state.errs.staff = errMsg(staff); }
  if (shien.status === 'fulfilled' && shien.value && shien.value.ok) state.shien = shien.value.records || [];
  else { state.shien = []; state.errs.shien = errMsg(shien); }
  if (userList.status === 'fulfilled' && userList.value && userList.value.success) state.userList = userList.value.user_list || [];
  else { state.userList = []; state.errs.userList = errMsg(userList); }
  if (tsushoUsers.status === 'fulfilled' && tsushoUsers.value && tsushoUsers.value.ok) state.tsushoUsers = tsushoUsers.value.users || [];
  else { state.tsushoUsers = []; state.errs.tsushoUsers = errMsg(tsushoUsers); }
  if (yotei.status === 'fulfilled' && yotei.value && yotei.value.ok) state.yotei = yotei.value.records || [];
  else { state.yotei = []; state.errs.yotei = errMsg(yotei); }
  // 出力2チェック。取得に失敗したら「全部未」で描く（勝手に済にしない＝取りこぼしを隠さない）
  if (output.status === 'fulfilled' && output.value && output.value.ok) {
    state.output = { rows: output.value.records || [], legacy: output.value.legacy || [] };
  } else { state.output = { rows: [], legacy: [] }; state.errs.output = errMsg(output); }
  buildDerived();
  fillStaffSelect();
  statusEl.textContent = '';
  renderErrBar();
  renderAll();
}

// ===== 日付ナビ（案X-1）＋ 警告バナー（案X-8）=====
// 「今日ではない日を見ている」を画面上部で1回だけ伝える。文言は measure-core.js の msDateWarning が正。
function updateDateNav() {
  const pick = document.getElementById('datePick');
  if (pick) pick.value = state.selectedDate;
  const w = msDateWarning(state.selectedDate, state.today);
  const el = document.getElementById('dstate');
  el.className = 'dstate' + (w.show ? ' on ' + w.kind : '');
  el.textContent = w.show ? w.label + '　※期限・予定月の判定は今日基準のままです' : '';
}
function goDate(d) { if (/^\d{4}-\d{2}-\d{2}$/.test(d)) load(d); }
// 取得に失敗した系統を上部にまとめて出す（タブ3を見ている人にも気づかせる）
function renderErrBar() {
  const bar = document.getElementById('errbar');
  const label = { att: '来館予定', usage: '利用率', year: '個訓対象者', staff: 'スタッフ一覧', shien: '測定記録', userList: '利用者台帳', tsushoUsers: '通所対象者', yotei: '予定月', output: '出力チェック' };
  const keys = Object.keys(state.errs);
  if (!keys.length) { bar.style.display = 'none'; bar.textContent = ''; return; }
  bar.style.display = 'block';
  bar.textContent = '⚠ 一部データの取得に失敗しました：' + keys.map(k => label[k] || k).join('、') + '（↻再読込を試してください）';
}

// 測定者セレクトは読み込み時に一度埋める（スライドの updatedBy にも使うため・モーダル未オープンでも値が要る）
// 出力者セレクト（案X-5・要介護のみ表示）も同じ名簿から作る。既定は「（測定者と同じ）」＝空。
function fillStaffSelect() {
  const names = (state.staff || []).filter(s => MEASURER_EXCLUDE.indexOf(s) < 0);
  const opts = names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
  const sel = document.getElementById('recordStaffSelect');
  if (sel && !sel.options.length) sel.innerHTML = opts;
  const out = document.getElementById('recordOutputSelect');
  if (out && !out.options.length) out.innerHTML = '<option value="">（測定者と同じ）</option>' + opts;
}

// ===== 共通計算（利用者ごとの行モデル） =====
function buildDerived() {
  const t = state.today;
  const usageByName = {};
  if (state.usage) (state.usage.users || []).forEach(u => { usageByName[u.name] = u; });
  // 前回測定日（要介護）= 個別機能訓練計画書記録の最新 sokutei_date（userIdキー結合・台帳で氏名を直しても履歴が切れない）
  const lastById = {};
  (state.records || []).forEach(r => {
    const d = normDate(r.sokutei_date);
    if (!d || !r.userId) return;
    if (!lastById[r.userId] || d > lastById[r.userId]) lastById[r.userId] = d;
  });
  // 前回測定日（要支援・事業対象者）= 要支援測定記録の最新 sokutei_date（nameキー結合・Phase B）
  const lastShien = {};
  (state.shien || []).forEach(r => {
    const d = normDate(r.sokutei_date);
    if (!d || !r.name) return;
    if (!lastShien[r.name] || d > lastShien[r.name]) lastShien[r.name] = d;
  });
  // 利用者台帳から 利用曜日 / 午前・午後 / ふりがな を引く（共通フィルタの材料・新規に持たない）
  const daysByName = {}, ampmByName = {}, kanaByName = {};
  (state.userList || []).forEach(u => {
    if (!u.userName) return;
    daysByName[u.userName] = u.days;
    ampmByName[u.userName] = u.ampm || '';
    kanaByName[u.userName] = u.userNameKana || '';
  });
  // 当月の測定実績（＝「今月やる人」タブの済判定・A-2）。
  // ⚠️予定月(nextYm)では判定できない。測定すると nextYm が周期ぶん進んで isDue が偽になるため、
  //   nextYm だけで見ると済んだ人が一覧から消え「今月何をやったか」が分からなくなる。だから実績で拾う。
  // ソースは2つ: 要支援測定記録（nameキー）∪ 個別機能訓練計画書記録13列目（userIdキー）。
  // source='paper'（紙台帳の遡り投入）は除く。測定者不明で日付も月初仮置きのため、
  //   「今月やった仕事」として数えるのは実態に合わない（タブ3のスタッフ%と同じ扱い）。
  const ym = thisYm();
  const doneById = {}, doneByName = {};
  function keepDone(bag, key, date, by) {
    if (!key || !date || date.slice(0, 7) !== ym) return;
    if (!bag[key] || date > bag[key].date) bag[key] = { date: date, by: String(by || '').trim() };
  }
  (state.records || []).forEach(r => keepDone(doneById, r.userId, normDate(r.sokutei_date), r.sokutei_by));
  (state.shien || []).forEach(r => {
    if (r.source === 'paper') return;
    keepDone(doneByName, normKey(r.name), normDate(r.sokutei_date), r.sokutei_by);
  });
  const attCare = {};
  if (state.att) ['am', 'pm'].forEach(k => (state.att.attendance[k] || []).forEach(a => { if (a.care) attCare[a.name] = a.care; }));
  const monthKeys = prevMonthsList(3);
  const rowByName = {};
  // 予定月（domain='sokutei'）を userId／正規化名の両方で引けるようにする
  const yoteiByKey = {};
  (state.yotei || []).forEach(y => {
    if (y.userId) yoteiByKey[y.userId] = y;
    if (y.userId) yoteiByKey[normKey(y.userId)] = y;
    if (y.name) yoteiByKey[normKey(y.name)] = y;
  });

  // last = 実測定日（無ければ空）／ baseFallback = 実測定日が無い時だけ使う起点（要介護のplanStartのみ・要支援は無し）
  // userId = 予定月シートの主キー側（要介護＝台帳の名前・要支援＝通所V2のuserId）
  // plan = { planStart, planMonths }（要介護のみ。要支援・事業対象者は計画書が無いので null）
  function buildRow(userId, name, care, kana, weekdaysRaw, last, baseFallback, plan) {
    const uu = usageByName[name];
    const weekdays = (uu && uu.weekdaysRaw) || weekdaysRaw || '';
    const monthsArr = [];
    if (uu && uu.monthly) monthKeys.forEach(mk => {
      const mo = uu.monthly[mk];
      if (mo) {
        const sch = Number(mo.scheduled) || 0;
        monthsArr.push({ scheduled: sch, attended: sch - (Number(mo.absences) || 0) });  // 出席 = 予定 − 欠席（推定）
      }
    });
    const base = last || baseFallback || '';
    let due = '', remaining = -999;   // どちらも無ければ未測定 = 最優先扱い
    if (base) { due = sokuteiDueDate_(base, care); remaining = sokuteiRemaining_(due, t); }
    const y = yoteiByKey[userId] || yoteiByKey[normKey(userId)] || yoteiByKey[normKey(name)] || null;
    // 当月の実績（済判定）。要介護は userId・要支援等は正規化名で引き、両方見つかれば新しい方を採る。
    const dById = doneById[userId] || null, dByName = doneByName[normKey(name)] || null;
    let done = null;
    if (dById && dByName) done = (dById.date >= dByName.date) ? dById : dByName;
    else done = dById || dByName;
    rowByName[name] = {
      userId: userId, name: name, kana: kana || kanaByName[name] || '', care: care,
      remaining: remaining, R: sokuteiRemainingVisits_(weekdays, t), U: sokuteiUsageRate_(monthsArr),
      last: last, base: base, due: due, unmeasured: !base, weekdays: weekdays,
      // 共通フィルタの材料（利用者台帳の「午前/午後」列。'午前' / '午後' / '月午前、木午後' の3形）
      ampm: ampmByName[name] || '',
      // 予定月（段階1の対象判定の正）。行が無い＝未設定は isDue が true を返す＝漏れとして対象に出す。
      nextYm: y ? y.nextYm : '', slideCount: y ? y.slideCount : 0, hasYotei: !!y,
      // 測定周期。予定月シートの値を正とし、行が無ければ介護度から引く（判定は shared.js §I に単一化）
      cycleMonths: (y && y.cycleMonths) || sokuteiCycleMonths_(care),
      // 個訓の計画書サイクル（要介護のみ）。'' は算出不能。
      //   planYm … 計画期間の開始月。★画面に「計画書 ◯月」と出す表示用
      //   dueYm  … 測定の期限（＝評価月＝計画期間が始まる前の月）。★判定に使うのはこちら
      // 2つを分けている理由: 期限をそのまま「計画書 ◯月」と表示すると、今度は表示が嘘になるため。
      planStart: plan ? String(plan.planStart || '') : '',
      planMonths: plan ? plan.planMonths : null,
      planYm: plan ? nextPlanStartYm(plan.planStart, plan.planMonths, ym) : '',
      dueYm: plan ? nextDueYm(plan.planStart, plan.planMonths, ym) : '',
      // 当月に測定済みなら { date, by }。「今月やる人」タブで済として下に積む（A-2/A-4）
      doneThisMonth: done
    };
  }

  // 要介護（個別機能訓練計画書対象・getKeikakushoYear）
  (state.users || []).forEach(u => {
    const care = u.category || attCare[u.name] || '';
    buildRow(u.userId, u.name, care, u.furigana, u.days, lastById[u.userId] || '', normDate(u.planStart),
      { planStart: u.planStart, planMonths: u.planMonths });
  });
  // 要支援・事業対象者（getTsushoPlansYearV2の対象者から要介護以外を抽出・Phase B）
  (state.tsushoUsers || []).forEach(u => {
    if (u.cancelled || isKaigoCare(u.category) || rowByName[u.name]) return;
    buildRow(u.userId || u.name, u.name, u.category || '', u.furigana, daysByName[u.name] || '', lastShien[u.name] || '', '');
  });
  derived = { rowByName: rowByName };
}

// opt = { gray, tag, nextVisit, showSlide, showRec, sunkable }
//   showSlide : 「📅来月へ」を出すか（今日の優先タブのみ）
//   showRec   : 記録ボタン＋カード全体タップを有効にするか
//   sunkable  : 済んだ行をグレーで沈めるか。今日の優先タブ（＝その日の作業リスト）だけ true。
//               全利用者タブは名簿なので沈めない＝いつでも予定月を触れる状態を保つ。
// 送信中(busy)・済(sunk)・失敗(rowErr) は state を見て描画に反映する。
//   ボタンごとに個別実装せず runRowAction() 1本に集約している（同じ不具合を3箇所に作らない）。
// カード全体タップ（案X-6）: 記録が出せる行はカードのどこを押しても記録モーダルが開く。
//   個別ボタンは event.stopPropagation() でカードのタップに吸われないようにする。
function rowCard(r, opt) {
  const o = opt || {};
  const gray = !!o.gray, tag = o.tag || '', nextVisit = o.nextVisit || '';
  const showSlide = !!o.showSlide, showRec = !!o.showRec;
  let remainHtml;
  if (r.unmeasured) remainHtml = '<span class="over">⚠️未測定（最優先）</span>';
  else if (r.remaining < 0) remainHtml = '<span class="over">⚠️超過 ' + (-r.remaining) + '日</span>';
  else remainHtml = '期限まで残り ' + r.remaining + '日';
  const sunk = (o.sunkable && state.sunk[r.name]) || null;   // 済んだ行（案X-4・{ label }）
  const b = busy[r.name];                 // 送信中なら { which: 'slide'|'ym'|'rec' }
  const dis = b ? ' disabled' : '';       // 送信中は同じ行の全ボタンを無効化（1-9-2）
  const lbl = (which, normal) => (b && b.which === which) ? '⏳ 送信中…' : normal;
  const stop = 'event.stopPropagation();';
  const doneRow = !!(o.markDone && r.doneThisMonth);   // 当月測定済み＝記録の入口は塞ぐ（二重記録防止）
  // 記録ボタンは要介護・要支援等の両方に出す（段階1で addSokuteiDone に一本化）。
  const recBtn = (showRec && !sunk && !doneRow)
    ? '<button type="button" class="rec-btn" data-name="' + esc(r.name) + '"' + dis
      + ' onclick="' + stop + 'openRecordModal(this.dataset.name)">' + lbl('rec', '📝測定した') + '</button>'
    : '';
  // 済んだ行でも「📅来月へ」「予定 ▾」は残す（A-7）。予定の調整は済んだ後でも要るため。
  const slideBtn = (showSlide && !sunk)
    ? '<button type="button" class="slide-btn" data-name="' + esc(r.name) + '"' + dis
      + ' onclick="' + stop + 'slideToNextMonth(this.dataset.name)">' + lbl('slide', '📅来月へ') + '</button>'
    : '';
  // 午前/午後の枠（案X-3の列見出しと重複しないよう、欠席リストなど列外に出る行のためにも持たせる）
  const pill = r.session
    ? '<span class="pill ' + r.session + '">' + (r.session === 'am' ? '午前' : '午後') + '</span>' : '';
  // 「今月やる人」タブの済行（A-4）: 打消し線＋グレー＋「7/28 済（測定者）」
  const done = (o.markDone && r.doneThisMonth) ? r.doneThisMonth : null;
  const doneMark = done
    ? '<span class="done-mark">' + esc(fmtMD(done.date)) + ' 済'

    : '';
  const doneTag = sunk ? '<span class="done-tag">✅ ' + esc(sunk.label) + '</span>' : '';
  // 出力2チェック（3-1）。測定が済んだ行にだけ出す。まだ測っていない人に出力の概念は無い。

  const outSt = (o.showOutput && done) ? rowOutputStatus(r) : null;
  const outPending = !!(outSt && !(outSt.riyousha.done && outSt.caremgr.done));
  const outBtn = (kind) => {

  };
  const outHtml = outSt ? OUTPUT_KINDS.map(outBtn).join('') : '';
  // 済んだ行はグレーになるので、出力が残っていることだけは沈まないバッジで出す（3-4）
  const outBadge = outPending ? '<span class="out-pending">🖨📄 出力残</span>' : '';
  const outNote = (outSt && outSt.source === 'legacy')
    ? '<span class="out-legacy">出力 ' + esc(outSt.riyousha.by || '記録者不明') + '（旧アプリの記録）</span>' : '';

  // 計画月が算出できない要介護は黙って素通りさせず「計画月が不明」と出す（2-6）。
  const gap = rowPlanGap(r, r.nextYm);

  // 計画期間の開始月と、測定の期限は別物なので両方出す（期限だけだと「計画書はいつ？」が分からない）
  else if (r.planYm) planHtml = '<span class="plan-ym">計画書 ' + esc(r.planYm) + '</span>'
    + (r.dueYm ? ' <span class="plan-due">測定期限 ' + esc(r.dueYm) + '</span>' : '');
  // 期限に測定結果が無くなる人のバッジ。赤は「もう期限を過ぎた人」だけ（丙）。
  // まだ戻せる人はオレンジにする＝赤を増やさない（2026-07-29 社長決定）。
  const gapLv = planGapLevel(r, r.nextYm, thisYm());
  const gapBadge = gapLv
    ? '<span class="' + (gapLv === 'red' ? 'plan-gap' : 'plan-late') + '">'
      + (gapLv === 'red' ? '⚠' : '📋') + ' 測定期限' + esc(r.dueYm) + '／測定' + esc(r.nextYm || '未設定') + '予定</span>'
    : '';
  const ymHtml = sunk
    ? '予定 ' + esc(r.nextYm || '未設定')
    : '<button type="button" class="ym-btn" data-name="' + esc(r.name) + '"' + dis
      + ' onclick="' + stop + 'openYmPicker(this.dataset.name)">' + lbl('ym', '予定 ' + esc(r.nextYm || '未設定') + ' ▾') + '</button>';
  const errHtml = rowErr[r.name]
    ? '<div class="rowerr">⚠ 変更できませんでした：' + esc(rowErr[r.name]) + '（もう一度お試しください）</div>'
    : '';
  const tappable = showRec && !sunk && !done && !b;
  return '<div class="card b-' + r.badge + (gray ? ' gray' : '')
    + (sunk ? ' sunk' : '') + (done ? ' donerow' : '') + (outPending ? ' pendingrow' : '')
    + (gapLv === 'red' ? ' gaprow' : '') + (gapLv === 'late' ? ' laterow' : '')
    + (b ? ' busy' : '') + (tappable ? ' tappable' : '')
    + '" data-row="' + esc(r.name) + '"'
    + (tappable ? ' data-name="' + esc(r.name) + '" onclick="openRecordModal(this.dataset.name)"' : '') + '>'
    + '<div class="rowline">'
    + '<span class="bdg">' + (done ? '✅' : BADGE_EMOJI[r.badge]) + '</span>'
    + '<span class="nm">' + esc(r.name) + '</span>'
    + '<span class="cr">' + esc(r.care || '介護度不明') + '</span>'
    + pill
    + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '')
    + doneMark + outBadge + doneTag + gapBadge
    + recBtn + slideBtn
    + '</div>'
    + (outHtml ? '<div class="rowline">' + outNote + outHtml + '</div>' : '')
    + '<div class="meta">前回測定 ' + esc(lastLabel(r))
    + ' ／ ' + ymHtml + (planHtml ? ' ／ ' + planHtml : '') + ' ／ ' + remainHtml
    + ' ／ 今月あと約' + r.E.toFixed(1) + '回'
    + (nextVisit ? ' ／ 次回来館 ' + esc(nextVisit) : '')
    + '</div>' + errHtml + '</div>';
}

    .filter(r => isDue(r.nextYm, ym));
  const presentNames = {}; present.forEach(a => { presentNames[a.name] = true; });
  const restCount = dueAll.filter(r => !presentNames[r.name]).length;
  // ヘッダの人数は済んだ行を除いた「まだ測る人の数」＝押した結果がすぐ数字に出る（1-9-3）
  const dueCountNow = presentRows.filter(r => !state.sunk[r.name]).length;
  const dueCountAll = presentAllRows.filter(r => !state.sunk[r.name]).length;
  const filtering = ufActiveCount(uf, careFilter) > 0;

  let html = '<div class="hdr">' + esc(fmtMD(state.selectedDate)) + '・来館予定' + present.length + '名中 '
    + '今月の対象' + dueCountNow + '名'
    + (filtering ? '（全体' + dueCountAll + '名中）' : '') + '（残り' + restCount + '名）</div>';
  if (state.errs.yotei) html += '<div class="note">⚠ 予定月（getYotei）取得失敗のため全員を対象として表示しています：' + esc(state.errs.yotei) + '</div>';
  if (state.errs.usage) html += '<div class="note">⚠ 利用率（usage_stats）取得失敗のため E は残り回数のみで計算しています</div>';
  if (filtering && !presentRows.length && !absentRows.length) {
    el.innerHTML = html + UF_EMPTY_HTML;   // 絞り込みで0件（B-6）。完了と紛らわしいので「完了✅」は出さない
    return;
  }
  if (!dueCountNow) {
    html += '<div class="done-all">今月ぶん完了 ✅</div>'
      + '<div class="note">この日に来館の方で、今月が予定月の方はいません' + (restCount ? '（別日に測る方が ' + restCount + '名います）' : '') + '</div>';
  }
  // 午前／午後の2カラム（案X-3・広幅は並列・狭幅は縦積み）
  const sp = msSplitBySession(presentRows);
  if (presentRows.length) html += '<div class="cols">' + colHtml('am', '午前', sp.am) + colHtml('pm', '午後', sp.pm) + '</div>';
  if (absentRows.length) {
    html += '<div class="section-label">🚫 この日は欠席（今月が予定月・' + absentRows.length + '名）</div>';
    absentRows.forEach(r => { html += rowCard(r, { gray: true, tag: '欠席', sunkable: true }); });
  }
  html += '<div class="note">※「残り」＝今月が予定月だが、この日に来館していない方（' + restCount + '名）。予定月が来ていない方は「👥全利用者」タブで確認できます。</div>';
  el.innerHTML = html;
}

// ===== タブ「今月やる人」（A）=====
// 「今日誰を測るか」だけでなく「今月どこまで終わったか」を1画面で見るためのタブ。
// 未（まだの人）を上、済（今月やった人）を下に積む。
// ★済は実績ベースで拾う（A-2）。測定すると nextYm が周期ぶん進んで isDue が偽になるため、
//   予定月だけで判定すると済んだ人が一覧から消えて「今月何をやったか」が分からなくなる。
//   buildDerived が当月の測定実績を doneThisMonth に載せているので、それを使う。
function renderTabMonth() {
  const el = document.getElementById('tab4');
  if (!state.users.length) { el.innerHTML = errCard('個訓対象者（getKeikakushoYear）', state.errs.year); return; }
  const ym = thisYm();
  const all = Object.keys(derived.rowByName).map(n => derived.rowByName[n]);
  // 母集団 = 今月が予定月の人（未）∪ 今月すでに測った人（済・予定月は先へ進んでいる）
  // ★計画書に間に合わない人は、予定月が先へ行って対象外になっても一覧から消さない（2-4）。
  //   消すと「計画書の月に測定が無い」状態が誰の目にも触れないまま残るため。
  const pool = all.filter(r => isDue(r.nextYm, ym) || r.doneThisMonth || rowPlanGap(r, r.nextYm).warn);
  // sokuteiSort_ は並べ替えだけでなく badge / tier / E の付与も担う（rowCard がそれを描く）ので、
  // 未・済に分ける前に必ず一度通す。済だけ素通しにすると E が undefined になって描画で落ちる。
  const rows = sokuteiSort_(applyAllFilters(pool));
  const filtering = ufActiveCount(uf, careFilter) > 0;

  // 計画書に間に合わない人は最上部の専用枠へ集める（未／済には重複して出さない）
  // 赤とオレンジの振り分けは splitMonthRows に一本化（同じ判定を2箇所に書かない・4-4）
  const split = splitMonthRows(rows, ym);
  const gapRows = split.gapRows, rest = split.rest;
  const undone = rest.filter(r => !r.doneThisMonth);                 // 未は既存の優先度（tier→E→かな）のまま（A-3）
  const done = rest.filter(r => r.doneThisMonth).sort((a, b) => {    // 済は新しく測った順
    if (a.doneThisMonth.date !== b.doneThisMonth.date) return a.doneThisMonth.date < b.doneThisMonth.date ? 1 : -1;
    const ka = String(a.kana || a.name || ''), kb = String(b.kana || b.name || '');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });

  // 出力2チェックで済を2つに割る（3-3）。★出力が残っている人は測定済でも一覧から消さない（3-4）。
  //   消すと「印刷もPDFもまだ」の人が誰の目にも触れないまま今月が終わる。
  const pending = done.filter(r => outputStage(r) === 'pending');
  const complete = done.filter(r => outputStage(r) === 'complete');

  const m = +ym.slice(5, 7);
  // ヘッダは3段階で数える（3-5）。「済」ではなく「完了」＝測定＋出力2つまで終わった人。
  let html = '<div class="hdr">' + m + '月の対象 ' + (undone.length + done.length) + '名'
    + (filtering ? '（全体' + pool.length + '名中）' : '')
    + '／完了 ' + complete.length + '・出力残 ' + pending.length + '・測定未 ' + undone.length + '</div>';
  html += '<div class="note">※「完了」＝測定と2つの出力（🖨利用者用・📄ケアマネ用）が全部済んだ人。'
    + '「出力残」＝測定は済んだが出力が残っている人。「測定未」＝まだ測っていない人。</div>';
  // 期限を過ぎてしまった人数は独立した1行で出す（2-5）。対象の内数ではなく別枠の警告として読ませる
  if (gapRows.length) {
    html += '<div class="hdr" style="color:#c62828">⚠測定を1回分まるごと飛ばしています ' + gapRows.length + '名</div>';
  }
  if (state.errs.yotei) html += '<div class="note">⚠ 予定月（getYotei）取得失敗のため全員を対象として表示しています：' + esc(state.errs.yotei) + '</div>';
  if (state.errs.output) html += '<div class="note">⚠ 出力チェック（getSokuteiOutput）の取得に失敗したため、出力は全員「未」で表示しています：' + esc(state.errs.output) + '</div>';

  if (filtering && !rows.length) { el.innerHTML = html + UF_EMPTY_HTML; return; }   // B-6
  // 最上部に固定で見せる（2-4）。対象外になっていても消さない
  // 赤の枠は「もう測定期限を過ぎてしまった人」だけに残す（丙・赤を増やさない）
  if (gapRows.length) {
    html += '<div class="gap-head">⚠ 測定を1回分まるごと飛ばしています（' + gapRows.length + '名）<br>'
      + '予定月が測定期限を周期ぶん以上あとへ動いています。入院・長期欠席などで本当に測れない方です。'
      + '計画書の作成時期をケアマネと相談してください。</div>';
    gapRows.forEach(r => { html += rowCard(r, { showSlide: true, showRec: true, markDone: true, showOutput: true }); });
  }
  // オレンジ枠（4・C-2）。意味の違う2つを同じ枠に「別の行」として置く。
  //   1行目 ⏰ 予定月を過ぎています   … 予定月が当月より前。測り忘れ
  //   2行目 📋 計画に間に合いません   … 予定月が測定期限より後ろ。まだ戻せば間に合う
  // ★赤に出ている人はどちらにも出さない＝二重表示しない（4-4・splitMonthRows が担保）。
  const overdueRows = split.overdueRows, lateRows = split.lateRows;
  if (overdueRows.length || lateRows.length) {
    html += '<div class="overdue-head">';
    if (overdueRows.length) {
      html += '⏰ 予定月を過ぎています（' + overdueRows.length + '名）<br>'
        + esc(overdueBreakdown(overdueRows)) + '<br>'
        + '予定月が来たのにまだ測定できていない方です。下の一覧にも並んでいます。';
    }
    if (lateRows.length) {
      html += (overdueRows.length ? '<div class="overdue-line">' : '')
        + '📋 計画に間に合いません（' + lateRows.length + '名）<br>'
        + esc(lateBreakdown(lateRows)) + '<br>'
        + '測定期限より後ろに予定月が置かれています。予定月を期限の月までに戻せば間に合います。'
        + (overdueRows.length ? '</div>' : '');
    }
    html += '</div>';
  }
  // 「今月ぶん完了 ✅」は測定未0かつ出力残0のときだけ（3-6）。出力が残っているうちは完了ではない。
  if (!undone.length && !pending.length && (done.length || !filtering)) {
    html += '<div class="done-all">今月ぶん完了 ✅</div>'
      + '<div class="note">' + m + '月が予定月の方は測定も出力も全部終わっています（完了 ' + complete.length + '名）。</div>';
  }
  if (undone.length) {
    html += '<div class="section-label">🟡 まだの人（測定未 ' + undone.length + '名）</div>';
    undone.forEach(r => { html += rowCard(r, { showSlide: true, showRec: true, markDone: true, showOutput: true }); });
  }
  if (pending.length) {
    html += '<div class="section-label">🖨 出力が残っている人（' + pending.length + '名）</div>';
    pending.forEach(r => { html += rowCard(r, { showSlide: true, markDone: true, showOutput: true }); });
  }
  if (complete.length) {
    html += '<div class="section-label">✅ 完了（' + complete.length + '名）</div>';
    complete.forEach(r => { html += rowCard(r, { showSlide: true, markDone: true, showOutput: true }); });
  }
  html += '<div class="note">※「測定済」は当月の測定実績で判定しています（予定月は測定すると先へ進むため、予定月では判定できません）。'
    + '紙台帳の遡り投入（source=paper）は今月の実績に数えていません。'
    + 'ケアマネへ送る作業は送付管理アプリの担当です。ここは「出力したか」までを見ています。</div>';
  el.innerHTML = html;
}

// ===== タブ2: 全利用者 期限順 =====
function renderTab2() {
  const el = document.getElementById('tab2');
  if (!state.users.length) { el.innerHTML = errCard('個訓対象者（getKeikakushoYear）', state.errs.year); return; }
  const all = [];
  Object.keys(derived.rowByName).forEach(n => all.push(derived.rowByName[n]));
  // sokuteiSort_ は badge/tier/E 付与に流用し、タブ2の並びは期限（remaining）昇順・同値はkana順（設計書§4-2）。未測定=-999 が自然に最上位
  const decorated = sokuteiSort_(all);
  decorated.sort((a, b) => {
    if (a.remaining !== b.remaining) return a.remaining - b.remaining;
    const ka = String(a.kana || a.name || ''), kb = String(b.kana || b.name || '');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  // 介護度の3択は共通フィルタバーへ移設した（曜日・時間帯・名前検索と同じ場所で操作できるように）。
  // ここでは掛けるだけ。掛ける前の数は「（全体◯名中）」の母数に使う。
  const rows = applyAllFilters(decorated);
  const filtering = ufActiveCount(uf, careFilter) > 0;
  // タブ2は予定月で絞らない（対象外の人も従来どおり全員見える・5-7）。予定月は各行に併記する。
  const dueCount = rows.filter(r => isDue(r.nextYm, thisYm())).length;
  let html = '<div class="hdr">全 ' + rows.length + '名'
    + (filtering ? '（全体' + decorated.length + '名中）' : '')
    + '（期限が近い順）／うち今月が予定月 ' + dueCount + '名</div>';
  if (filtering && !rows.length) { el.innerHTML = html + UF_EMPTY_HTML; return; }   // B-6
  rows.forEach(r => { html += rowCard(r, { nextVisit: nextVisitStr(r.weekdays, state.today) }); });
  el.innerHTML = html;
}

// ===== タブ3: スタッフ別実施バランス =====
function setPeriod(n) { periodMonths = n; renderTab3(); }
function renderTab3() {
  const el = document.getElementById('tab3');
  if (!state.records.length && state.errs.year) { el.innerHTML = errCard('測定記録（getKeikakushoYear）', state.errs.year); return; }
  const t = state.today;
  const cutoff = monthsAgoStr(periodMonths);
  const counts = {}, lastBy = {};
  let totalPeriod = 0;   // シェア%の分母 = 期間内総測定件数
  // 要支援等は 'app'（実測定）のみ集計対象。'paper'（紙台帳投入・測定者不明・日付は月初仮置き）は
  // 実施バランス分析の対象外＝件数に含めない（含めると誰にも属さない件数で総数だけ膨らむ）。
  const allRecords = (state.records || []).concat((state.shien || []).filter(r => r.source !== 'paper'));
  allRecords.forEach(r => {
    const d = normDate(r.sokutei_date);
    if (!d) return;
    const inPeriod = d >= cutoff && d <= t;
    if (inPeriod) totalPeriod++;
    const by = String(r.sokutei_by || '').trim();
    if (!by) return;
    if (!lastBy[by] || d > lastBy[by]) lastBy[by] = d;   // 最終測定日は期間外も含む全期間
    if (inPeriod) counts[by] = (counts[by] || 0) + 1;
  });
  // 表示対象 = staff_list − 除外3名（0件も全員）＋ records にだけ現れる測定者
  const names = (state.staff || []).filter(s => MEASURER_EXCLUDE.indexOf(s) < 0);
  Object.keys(counts).forEach(n => { if (names.indexOf(n) < 0 && MEASURER_EXCLUDE.indexOf(n) < 0) names.push(n); });
  const rows = names.map(n => ({ name: n, count: counts[n] || 0, last: lastBy[n] || '' }));
  rows.sort((a, b) => (b.count - a.count) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  const max = rows.reduce((m, r) => Math.max(m, r.count), 0);
  const pb = n => '<button type="button" class="f-btn' + (periodMonths === n ? ' active' : '') + '" onclick="setPeriod(' + n + ')">' + n + 'ヶ月</button>';
  let html = '<div class="filter-row">' + pb(1) + pb(2) + pb(3) + '</div>';
  html += '<div class="hdr">' + esc(fmtMD(cutoff)) + '〜' + esc(fmtMD(t)) + '・総測定 ' + totalPeriod + '件</div>';
  if (state.errs.staff) html += '<div class="note">⚠ スタッフ一覧（staff_list）取得失敗のため records に現れる測定者のみ表示しています</div>';
  html += '<div class="card">';
  if (!rows.length) html += '<div class="meta">表示できるスタッフがいません</div>';
  rows.forEach(r => {
    const pct = totalPeriod > 0 ? Math.round(r.count / totalPeriod * 100) : 0;
    const w = max > 0 ? Math.max(r.count / max * 100, r.count > 0 ? 2 : 0) : 0;
    html += '<div class="sbar-row">'
      + '<div class="sbar-name">' + esc(r.name) + '</div>'
      + '<div class="sbar-track"><div class="sbar-fill" style="width:' + w + '%"></div></div>'
      + '<div class="sbar-val">' + r.count + '件 (' + pct + '%)</div>'
      + '<div class="sbar-last">' + (r.last ? '最終 ' + esc(fmtMD(r.last)) : '—') + '</div>'
      + '</div>';
  });
  html += '</div><div class="note">※データ起点 2026/6/15（Phase1開始）</div>';
  el.innerHTML = html;
}

// ===== 操作フィードバック（2026-07-28 本番不具合の修正・最優先）=====
// 事象: 「📅来月へ」を押しても画面が無反応で、押せていないと思って2回押し、2ヶ月進んで9月まで飛んだ。
// 原因: サーバ応答を await してから renderAll() していたため、押した瞬間に何も変わらなかった。
// 対策: 押下の瞬間に描画へ反映し、応答までその行の全ボタンを無効化する。
//   ★3つのボタン（📅来月へ / 予定▾ / 今日測定した）は必ず runRowAction() を通す。
//     個別に書くと同じ不具合を3箇所に作ることになる。
const UNDO_MS = 5000;       // Undoバーの表示時間
const UNDO_FADE_MS = 1200;  // 消える直前に薄くする時間（「もう消える」を伝える）
const busy = {};            // name -> { which:'slide'|'ym'|'rec' } 送信中の行（in-flight ロック）
const rowErr = {};          // name -> 失敗メッセージ

// 押下 → 即時フィードバック → 送信 → 成否の明示 までを1本化した共通ヘルパー。
// 戻り: 成功なら fn() の返り値／送信しなかった・失敗なら null。
async function runRowAction(name, which, fn) {
  if (busy[name]) return null;   // 連打の2回目以降は送信しない（1-9-2）
  busy[name] = { which: which };
  delete rowErr[name];
  renderAll();                   // ★応答を待たずに「⏳送信中…」＋無効化を出す（1-9-1）
  try {
    const out = await fn();
    delete busy[name];
    return out;
  } catch (err) {
    delete busy[name];
    // 失敗したら表示を元に戻し、行に理由を出す（黙って戻さない・1-9-4）
    rowErr[name] = (err && err.message) || String(err);
    renderAll();
    return null;
  }
}
// 済んだ行を「沈める」（案X-4・従来のフェードして消す挙動から変更）。
// 消してしまうと「本当に入ったのか」が確かめられず、スタッフが不安になって二度押しする。
// グレーで残し ✅ と結果ラベルを出せば、押した結果がその場に残る。再読込（load）でリセットされる。
function sinkRow(name, label) {
  state.sunk[name] = { label: label };
  renderAll();
}
function unsinkRow(name) { delete state.sunk[name]; renderAll(); }

// ===== 5秒Undoバー（newmail.html の5秒Undo方式に倣う・画面上部に固定表示）=====
let undoTimer = null, undoFadeTimer = null;
function hideUndoBar() {
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  if (undoFadeTimer) { clearTimeout(undoFadeTimer); undoFadeTimer = null; }
  const bar = document.getElementById('undoBar');
  if (bar) { bar.style.display = 'none'; bar.className = 'undo-bar'; }
}
function showUndoBar(msg, onUndo) {
  const bar = document.getElementById('undoBar');
  bar.innerHTML = '<span class="undo-msg"></span><button type="button" class="undo-btn">↩戻す</button>';
  bar.querySelector('.undo-msg').textContent = msg;
  bar.querySelector('.undo-btn').onclick = function () { hideUndoBar(); return onUndo(); };
  bar.className = 'undo-bar';           // fading を落として出し直す（連続操作でも必ず5秒見える）
  bar.style.display = 'flex';
  if (undoTimer) clearTimeout(undoTimer);
  if (undoFadeTimer) clearTimeout(undoFadeTimer);
  // 消える直前に薄くする＝「もう消える」が分かる（1-9-6）
  undoFadeTimer = setTimeout(function () {
    const b = document.getElementById('undoBar');
    if (b) b.className = 'undo-bar fading';
  }, UNDO_MS - UNDO_FADE_MS);
  undoTimer = setTimeout(hideUndoBar, UNDO_MS);
}
function operatorName() {
  const sel = document.getElementById('recordStaffSelect');
  return (sel && sel.value) || '';
}
async function callYotei(action, name) {
  const r = derived.rowByName[name];
  if (!r) throw new Error('対象が見つかりません');
  const url = GAS + '?action=' + action + '&userId=' + encodeURIComponent(r.userId || r.name)
    + '&domain=sokutei&by=' + encodeURIComponent(operatorName()) + '&t=' + Date.now();
  const res = await fetchJson(url);
  if (!res.ok) throw new Error((res && res.error) || '更新に失敗しました');
  r.nextYm = res.row.nextYm;
  r.slideCount = res.row.slideCount;
  r.hasYotei = true;
  return res.row;
}
// 計画月を越えて測定結果が無くなるときの確認（2-2）。書き込みの「前」に1回だけ出す。
// 「やめる」なら false を返し、呼び出し側は runRowAction にも入らない＝送信そのものが起きない。
// 社長決定: 完全には塞がない。入院・長期休みで本当に測れないことがあるため、押せば通す。
function confirmPlanGap(r, chosenYm) {
  const gap = rowPlanGap(r, chosenYm);
  if (!gap.warn) return true;
  // ★文面は「期限」で組む。計画期間の開始月ではない（2026-07-29 訂正）。
  //   測定・評価・計画書作成は計画期間が始まる前の月に済ませるのが実務のため。
  const cm = +String(r.dueYm).slice(5, 7), sm = +String(chosenYm).slice(5, 7);
  return confirm(
    r.name + ' さんの測定期限は ' + cm + '月です（計画書 ' + (r.planYm || '月不明') + ' のぶん）。\n'
    + sm + '月にすると、計画書を作るときに使える測定結果がありません。\n\nよろしいですか？'
  );
}

async function slideToNextMonth(name) {
  const r0 = derived.rowByName[name];
  // 送る先＝いまの予定月の翌月。判定は yotei-core.js の nextYmSlide と同じ土俵で行う
  if (r0 && !confirmPlanGap(r0, nextYmSlide(r0.nextYm || thisYm()))) return;   // 「やめる」＝送信しない
  const row = await runRowAction(name, 'slide', () => callYotei('slideYotei', name));
  if (!row) return;                                  // 連打の2回目 or 失敗（行に理由が出ている）
  const m = +row.nextYm.slice(5, 7);
  sinkRow(name, m + '月へ送りました');                 // 対象から外れた行はグレーで沈める（案X-4）
  showUndoBar(name + ' を' + m + '月へ送りました', () => undoSlide(name));
}
async function undoSlide(name) {
  const row = await runRowAction(name, 'slide', () => callYotei('undoSlideYotei', name));
  if (!row) return;
  unsinkRow(name);                                   // 戻したら沈めも解除して元の行に復帰させる
}

// ===== 出力2チェック（🖨 利用者用／📄 ケアマネ用）のトグル（3-1/3-2）=====
// 1タップで済、もう一度で未に戻る。押した結果はその場に残す（沈めない・消さない）。
// 📅来月へ／予定▾／📝測定した と同じ runRowAction を通す＝送信中表示・連打防止・失敗時復帰が同じ挙動になる。
function upsertOutputRow_(row) {
  const rows = state.output.rows || (state.output.rows = []);
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].userId === row.userId && rows[i].domain === row.domain && rows[i].ym === row.ym) {
      rows[i] = row; return;
    }
  }
  rows.push(row);
}
async function toggleOutput(name, kind) {
  const r = derived.rowByName[name];
  if (!r || !r.doneThisMonth) return;                 // 測っていない人に出力は無い
  if (OUTPUT_KINDS.indexOf(kind) < 0) return;
  if (busy[name]) return;                             // 送信中は他のボタンも押せない（1-9-2）
  const ym = String(r.doneThisMonth.date).slice(0, 7);
  const next = !rowOutputStatus(r)[kind].done;        // いまの見た目の逆へ倒す（取り消しも同じ入口）
  const row = await runRowAction(name, 'out-' + kind, async () => {
    const url = GAS + '?action=setSokuteiOutput&userId=' + encodeURIComponent(r.userId || name)
      + '&name=' + encodeURIComponent(name)
      + '&domain=sokutei&ym=' + encodeURIComponent(ym)
      + '&kind=' + encodeURIComponent(kind)
      + '&done=' + (next ? 'true' : 'false')
      + '&by=' + encodeURIComponent(operatorName()) + '&t=' + Date.now();
    const j = await fetchJson(url);
    if (!j.ok || !j.row) throw new Error((j && j.error) || '出力チェックの更新に失敗しました');
    return j.row;
  });
  if (!row) return;                                   // 連打の2回目 or 失敗（行に理由が出ている）
  upsertOutputRow_(row);
  renderAll();
}

// ===== 月タップ（予定月を任意の月へ直接指定・2026-07-28 社長決定）=====
// ケアプラン変更などのイレギュラーに、スタッフがその場で予定月を動かすための入口。
// ⚠️動かすのは予定月(nextYm)だけ。その人の周期(cycleMonths)は変えない
//   （GAS側 writeYotei_ が syncCycleFromCare を渡されない限り既存の周期を保持する＝構造的保証）。
// 「📅来月へ」は「よくあるケースの近道」として残す。こちらはイレギュラー用。
let ymPickerName = '';
function openYmPicker(name) {
  const r = derived.rowByName[name];
  if (!r) return;
  if (busy[name]) return;   // 送信中は開かせない（1-9-2）
  ymPickerName = name;
  document.getElementById('ymPickerName').textContent = name;
  const cur = r.nextYm || '';
  // 候補は当月から12ヶ月（過去月は出さない＝先頭が当月なので「今月の対象」へ戻せる）
  const list = ymCandidates(thisYm(), 12);
  // 計画月を越えて測定結果が無くなる月には⚠を付け、押す前に分かるようにする（2-3）
  document.getElementById('ymPickerGrid').innerHTML = list.map(ym => {
    const sel = (ym === cur);
    const risky = rowPlanGap(r, ym).warn;
    const m = +ym.slice(5, 7), y = +ym.slice(0, 4);
    const label = (y === +state.today.slice(0, 4) ? '' : y + '/') + m + '月';
    return '<button type="button" class="ym-cell' + (sel ? ' sel' : '') + (risky ? ' risky' : '') + '" data-ym="' + esc(ym) + '"'
      + ' onclick="pickYm(this.dataset.ym)">' + (sel ? '✓ ' : '') + esc(label) + (risky ? ' ⚠' : '') + '</button>';
  }).join('');
  // 計画書があるのに越える月が並ぶときだけ、注記を1行出す
  const noteEl = document.getElementById('ymPickerNote');
  if (noteEl) {
    const risky = list.some(ym => rowPlanGap(r, ym).warn);
    noteEl.textContent = risky
      ? '⚠ の月にすると、測定期限（' + r.dueYm + '）を過ぎて、計画書（' + r.planYm + '）に使える測定結果がありません。'
      : (rowPlanGap(r, cur).kind === 'unknownPlan' ? '※ この方は計画書の月が分かりません（開始月が未設定）。' : '');
    noteEl.style.display = noteEl.textContent ? '' : 'none';
  }
  document.getElementById('ymPicker').style.display = 'flex';
}
function closeYmPicker() {
  document.getElementById('ymPicker').style.display = 'none';
  ymPickerName = '';
}
async function setYm(name, ym) {
  const r = derived.rowByName[name];
  if (!r) throw new Error('対象が見つかりません');
  // care は「予定月シートに行が無い人」の新規作成時にだけ周期の決定材料として使われる。
  // 既存行の周期は GAS 側で保持されるため、ここで care を送っても周期は動かない。
  const url = GAS + '?action=setYotei&userId=' + encodeURIComponent(r.userId || r.name)
    + '&domain=sokutei&nextYm=' + encodeURIComponent(ym)
    + '&name=' + encodeURIComponent(r.name)
    + '&care=' + encodeURIComponent(r.care || '')
    + '&by=' + encodeURIComponent(operatorName()) + '&t=' + Date.now();
  const res = await fetchJson(url);
  if (!res.ok) throw new Error((res && res.error) || '更新に失敗しました');
  r.nextYm = res.row.nextYm;
  r.slideCount = res.row.slideCount;
  r.hasYotei = true;
  return res.row;
}
async function pickYm(ym) {
  const name = ymPickerName;
  const r = derived.rowByName[name];
  if (!r) return;
  const prev = r.nextYm || '';
  closeYmPicker();
  if (ym === prev) return;   // 同じ月＝変更なし
  if (!confirmPlanGap(r, ym)) return;   // 「やめる」＝送信しない（2-2）
  const row = await runRowAction(name, 'ym', () => setYm(name, ym));
  if (!row) return;
  const m = +row.nextYm.slice(5, 7);
  // 今月のままなら対象に残す（沈めない）。来月以降なら対象から外れるのでグレーで沈める（案X-4）
  if (isDue(row.nextYm, thisYm())) renderAll(); else sinkRow(name, m + '月に変更しました');
  showUndoBar(name + ' を' + m + '月に変更しました', () => undoSetYm(name, prev));
}
async function undoSetYm(name, prevYm) {
  if (!prevYm) { unsinkRow(name); return; }
  const row = await runRowAction(name, 'ym', () => setYm(name, prevYm));
  if (!row) return;
  unsinkRow(name);
}

// ===== 「今日測定した」ワンタップ記録（段階1: 要介護・要支援等とも addSokuteiDone に一本化） =====
// 【暫定】要介護の測定日は個訓アプリ（個別機能訓練計画書チェック.html）からも
//   「個別機能訓練計画書記録」13列目へ書ける。つまり段階1の間だけ書込先が2つ存在する。
//   これは意図的な暫定であり、片寄せ（個訓側の測定欄撤去）は段階3で行う。
//   前回測定日の読取は3ソース（新ログ ∪ 個訓13列目 ∪ 要支援測定記録）のまま維持しているため、
//   どちらから入力しても「済」として拾える（5-6）。
let recordTargetName = '';
function openRecordModal(name) {
  const r = derived.rowByName[name];
  if (!r) return;
  if (busy[name] || state.sunk[name]) return;   // 送信中・済んだ行は開かせない（二重記録の入口を塞ぐ）
  recordTargetName = name;
  document.getElementById('recordModalName').textContent = name;
  fillStaffSelect();
  // 過去日入力（案X-2）: 既定は日付ナビで選んでいる日。未来日は実施記録としてありえないので max で塞ぐ。
  const dEl = document.getElementById('recordDate');
  dEl.value = state.selectedDate;
  dEl.max = state.today;
  document.getElementById('recordNote').value = '';
  // 出力者（案X-5）は要介護のみ。要支援・事業対象者は記録シートに出力者列が無い（ⓑ確定・measure-core.js §msRouteWrite）
  const isKaigo = isKaigoCare(r.care);
  document.getElementById('recordOutputWrap').style.display = isKaigo ? '' : 'none';
  document.getElementById('recordOutputSelect').value = '';
  document.getElementById('recordHint').textContent = isKaigo
    ? '要介護：測定日・測定者・出力者を記録します。次回の予定月は「測定日の月＋3ヶ月」になります。'
    : '要支援・事業対象者：測定日・測定者を記録します（出力者はありません）。次回の予定月は「測定日の月＋4ヶ月」になります。';
  document.getElementById('recordModal').style.display = 'flex';
}
function closeRecordModal() {
  document.getElementById('recordModal').style.display = 'none';
  recordTargetName = '';
}
async function submitRecord() {
  const name = recordTargetName;
  const by = document.getElementById('recordStaffSelect').value;
  const note = document.getElementById('recordNote').value.trim();
  const date = document.getElementById('recordDate').value;
  if (!name || !by) return;
  if (busy[name]) return;                       // 送信中は二重送信しない（1-9-2）
  const r = derived.rowByName[name] || {};
  // 測定日の検証（案X-2）。未来日を通すと予定月が「測定日の月＋周期」で先へ飛んでしまう
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('測定日を選んでください。'); return; }
  if (date > state.today) { alert('未来の日付では記録できません。実際に測定した日を選んでください。'); return; }
  // 出力者は要介護のみ。空欄なら測定者と同じ（GAS側でも空→測定者に倒すが、送信時点で確定させておく）
  const outputBy = isKaigoCare(r.care) ? (document.getElementById('recordOutputSelect').value || by) : '';
  const btn = document.getElementById('recordConfirmBtn');
  btn.disabled = true; btn.textContent = '⏳ 記録中…';
  closeRecordModal();                           // モーダルは先に閉じ、行の「⏳送信中…」で進行を見せる
  // スライド・月タップと同じ共通ヘルパーを通す（ボタンごとに個別実装しない・1-9-5）
  const res = await runRowAction(name, 'rec', async () => {
    // addSokuteiDone = ①実施ログ追記 ②予定月を「実施月＋周期」へ更新 をセットで行う（GAS側でロールバック付き）
    // ★date は選んだ測定日をそのまま送る。GAS 側 nextYmAfterDone(date, 周期) が「測定日の月＋周期」で
    //   予定月を決めるため、過去日で入れても今日基準にはならない（案X-2の要件）。
    const url = GAS + '?action=addSokuteiDone&userId=' + encodeURIComponent(r.userId || name)
      + '&name=' + encodeURIComponent(name)
      + '&care=' + encodeURIComponent(r.care || '')
      + '&date=' + encodeURIComponent(date) + '&by=' + encodeURIComponent(by)
      + '&outputBy=' + encodeURIComponent(outputBy)
      + '&note=' + encodeURIComponent(note) + '&t=' + Date.now();
    const j = await fetchJson(url);
    if (!j.ok || !j.verified) throw new Error((j && j.error) || '書き込み検証に失敗しました');
    return j;
  });
  btn.disabled = false; btn.textContent = '記録する';
  if (!res) return;                             // 失敗（行に理由が出ている）
  state.shien.push(res.log);
  // 予定月をその場で反映（再取得せずに行が「済」になる）
  const yi = (state.yotei || []).findIndex(y => y.userId === res.yotei.userId && y.domain === res.yotei.domain);
  if (yi >= 0) state.yotei[yi] = res.yotei; else state.yotei.push(res.yotei);
  buildDerived();
  sinkRow(name, '測定を記録しました（' + fmtMD(date) + '）');   // 消さずにグレーで沈める（案X-4）
}

// ===== 日付ナビのイベント（案X-1）=====
document.getElementById('prevDay').addEventListener('click', () => goDate(msAddDays(state.selectedDate, -1)));
document.getElementById('nextDay').addEventListener('click', () => goDate(msAddDays(state.selectedDate, 1)));
document.getElementById('todayBtn').addEventListener('click', () => goDate(todayStr()));
document.getElementById('datePick').addEventListener('change', function () { goDate(this.value); });

load();
</script>
