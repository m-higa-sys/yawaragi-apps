# GitHub Pages 配信除外設定（2026-07-30）
#
# 目的：公開リポジトリから利用者情報・GASソース・設計情報が
#       誰でもダウンロードできる状態を止める。
#
# ⚠️ 以下は現場のアプリが読んでいる。絶対に exclude に入れないこと：
#    version.txt（25本のHTMLが読む）/ shared.js / auto-refresh-patch.js /
#    day-gate.js（日付またぎ検知。2026-08-07〜。落とすと開きっぱなし端末が前日の画面のまま固まる）/
#    measure-core.js / applauncher-render.js / stamp-dest-core.js /
#    furikae-mailing-core.js / assets/ / 全ての *.html /
#    gas/yawaragi-board/yotei-core.js（sokutei.html:263 が読む）
#    gas/yawaragi-board/session-board-core.js（measure-app.html:14 が読む）
#
# ⚠️ version.txt を落とすと「版を上げても端末が古い版を掴み続ける」状態になり、
#    画面上は正常に見えるため誰も気づけない。何があっても残すこと。
#
# ⚠️ _config.yml を置くと Jekyll のデフォルト exclude が置き換わるため、
#    node_modules も明示している。

